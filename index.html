<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f1ebdc" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Vinyl Scout</title>
<link rel="preload" href="fonts/lora-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>/* Self-hosted fonts (latin) — was Google Fonts; files from the official Fontsource/IBM npm releases, 2026-07-26 */
@font-face{font-family:"Lora";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lora-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Lora";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/lora-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2")}
</style>
  <link rel="stylesheet" href="/style.css?v=27" />
</head>
<body data-view="gallery">

<a class="sr-only sr-only-focusable" href="#main">Skip to records</a>

<header class="masthead">
  <a class="brand" href="/" aria-label="Vinyl Scout: home">
    <span class="brand__mark" aria-hidden="true">⦿</span>
    <h1>Vinyl Scout</h1>
  </a>
  <nav class="masthead__nav" aria-label="Primary">
    <a href="/seed.html">Add</a>
    <a href="/audit.html">Audit</a>
    <a href="/concert-radar.html">Concerts</a>
    <a href="/wishlist.html">Wishlist</a>
    <a href="/roadmap.html">Roadmap</a>
    <a href="/guide.html">Guide</a>
      <a href="/about.html">About</a>
  </nav>
</header>

<section class="controls" aria-label="Filters">
  <div class="controls__heading">
    <h2 class="controls__title">Full Collection</h2>
    <span class="controls__count" id="count">— records</span>
    <span class="controls__value" id="collection-value" hidden></span>
    <p class="controls__highlight" id="collection-highlight" hidden></p>
  </div>
  <div class="controls__search">
    <label for="search" class="sr-only">Search the collection</label>
    <input
      id="search"
      type="search"
      placeholder="Search artist, title, year…"
      autocomplete="off"
      spellcheck="false" />
  </div>
  <div class="controls__view" role="group" aria-label="View mode">
    <button id="view-list" class="vbtn" type="button" aria-pressed="false">List</button>
    <button id="view-gallery" class="vbtn is-on" type="button" aria-pressed="true">Gallery</button>
  </div>
  <div class="controls__chips" id="chips" role="group" aria-label="Filter by genre"></div>
</section>

<div id="error-banner" class="error-banner" hidden role="alert"></div>

<main id="main" class="gallery" tabindex="-1" aria-label="Records">
  <div class="empty">Loading…</div>
</main>

<div
  id="detail"
  class="detail"
  hidden
  role="dialog"
  aria-modal="true"
  aria-labelledby="detail-title"
  tabindex="-1">
  <div class="detail__backdrop" data-close="1" aria-hidden="true"></div>
  <article class="detail__panel" id="detail-panel">
    <button id="detail-close" class="detail__close" type="button" aria-label="Close detail">×</button>
    <div class="detail__inner" id="detail-inner"></div>
  </article>
</div>

<script src="/app.js?v=37"></script>
<footer class="site-footer">
  <div class="wrap">&copy; 2026</div>
</footer>

</body>
</html>
