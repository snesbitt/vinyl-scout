[build]
  ignore = "bash scripts/netlify-ignore.sh"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Function paths are declared via `export const config = { path: ... }`
# inside each function file.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# style.css / app.js are loaded with a ?v=NN cache-busting query string
# (bump the version in index.html whenever either file changes), so it's
# safe to cache them aggressively — a version bump is a new URL, not a
# stale cache hit.
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 2026-07-26: self-hosted fonts are content-stable — cache them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 2026-10-30: publish="." serves the whole repo, so internal docs, scripts,
# backups, seed and state files were public (CLAUDE.md returned 200). One
# forced 404 per path: Netlify allows a splat only at the end of a path, so
# '/*.md' is not possible. No page or Function fetches any of these over HTTP
# (catalog-cache.mjs bundles data/catalog-cache.json at build time; the Actions
# jobs read backups/ from the checkout). Add a rule here for any new root file
# that is not part of the site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/PROJECT.md"
  to = "/index.html"
