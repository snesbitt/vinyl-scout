[build]
  ignore = "bash scripts/netlify-ignore.sh"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/catalog-cache.json"]

# Function paths are declared via `export const config = { path: ... }`
# inside each function file.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# style.css / app.js are loaded with a ?v=NN cache-busting query string
# (bump the version in index.html whenever either file changes), so it's
# safe to cache them aggressively — a version bump is a new URL, not a
# stale cache hit.
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 2026-07-26: self-hosted fonts are content-stable — cache them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
