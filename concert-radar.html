  <style>
    /* Concert Radar — version: 11 (2026-08-03).
       v11: two fixes to the Watching panel, live-review pass after v10
       shipped. (1) A long entry (Buena Vista Social Club's "Feb 6–20,
       2027 · 7 dates") was pushing the row's × onto its own orphaned line
       — the row used to be one flex line with the delete button as just
       another flex-wrap item, so once the date text got long enough it
       wrapped and stranded the × below with nothing next to it. Fixed by
       restructuring each row into two stacked pieces: a top line with
       artist+city on the left and × pinned top-right (always together,
       never wraps away from each other), and a full-width second line
       below for date/price/ticket-link, free to wrap on its own without
       threatening the delete button's position. (2) Watching rows now also
       show a price range and a real "Get tickets ↗" link (pointing at the
       earliest matched date's SeatGeek URL) — previously only the date was
       surfaced, even though the underlying show data already carried
       price/url the whole time.
       v10: Susan's rule — "if i'm watching an artist/concert, remove the
       instance from coming soon. its either or." A watched artist's shows
       no longer render as their own Coming Soon card(s) at all; the date/
       price the v9 Watching-panel change already surfaces inline is now the
       ONLY place they show up, instead of appearing in both places. Match
       logic for "is this show already covered by a watch" reuses the same
       loose substring comparison findWatchMatches() already used (handles
       minor name-formatting drift between a typed watch entry and a show's
       artist field), so the hidden set and the Watching-panel date/price
       are always the same set of shows. Clicking "+ Watch" on a Coming Soon
       card (or on a Live Results card, if that artist already has real
       Coming Soon cards showing) now re-renders the whole list immediately,
       since watching an artist can remove card(s) that were on screen a
       moment ago — previously that click only toggled the button's own
       text/disabled state in place, which no longer reflects reality once
       watching can hide cards.
       v9: Susan flagged Buena Vista Social Club appearing as 7 near-
       identical cards (one per night of a residency at the same venue).
       Coming Soon now groups same-artist + same-venue shows into a single
       card showing a date range ("Feb 6 – 20, 2027 · 7 dates") instead of
       one row per date — ticket link points at the earliest date, price
       shows the min/max across all dates in the group, and deleting the
       card hides every underlying show, not just the first. Only groups
       catalog-swept shows; a manually pinned ("+ Add to Coming Soon") show
       from an ad-hoc search still gets its own card, since that was a
       deliberate one-at-a-time pick. The Coming Soon count badge now counts
       visible cards, not raw per-date shows, so it can't read as a mismatch
       against what's actually on screen. Live Results (the ad-hoc Search
       panel) is NOT grouped yet — same idea would apply there for an artist
       with several dates, just scoped out of this pass since Susan's report
       was specifically about Coming Soon.
       Same pass, three more direct requests:
       - Removed the "Restore hidden shows" link entirely, per Susan's
         request — hiding a real show is just final now, no undo UI. The
         underlying cr_hidden_ids_v1 mechanism is unchanged (a hidden show
         still won't reappear after a re-sweep), only the restore button
         and its wrapper are gone.
       - Added the standard site footer (`&copy; 2026`, same markup every
         other page uses) — this page never had one.
       - Watching rows now show the actual date (or date range, reusing the
         same grouping/range logic Coming Soon cards use) and price right
         in the row once a match exists, instead of a static "In Coming
         Soon" badge that told you a match existed but not what it was —
         Susan's point being she shouldn't have to scroll down and hunt for
         it herself.
       v8, two fixes from the same live-review pass:
       - Coming Soon cards gained a "+ Watch" button (parity with the one
         Live Results already had) — there was previously no way to start
         watching an artist directly from a Coming Soon card, only via the
         Watching panel's own form or from an ad-hoc Search result.
       - Companion fix lives in netlify/functions/tour-dates.mjs v4: Susan
         caught a real "Ultimate Sade Tribute Concert" rendering as a plain
         "Sade" show — a tribute act registered on SeatGeek under the bare
         artist name, which the exact-match performer check couldn't catch
         since the "tribute" language only ever showed up in the event's
         own title, which the matching logic wasn't checking. See that
         file's v4 note for the full fix (event-title-based blocklist,
         applied to every match regardless of tier).
       v7: Coming Soon is no longer the static 6-show mock array — it's now
       real data. On load (and every 12h after, or on demand via the new
       Refresh link), the page collects every distinct artist name across
       the catalog (/api/records) and wishlist (/api/wishlist), looks each
       one up through /api/tour-dates (concurrency-capped at 5 in flight so
       a ~100-artist collection doesn't fire 100 simultaneous requests), and
       renders whatever real upcoming shows come back. An artist with no
       confirmed match is just omitted — never an error — same
       graceful-degradation rule audio-preview already established. Results
       + a checked-at timestamp are cached in localStorage
       (cr_catalog_cache_v1) so a normal page visit is instant; only a stale
       cache or an explicit Refresh click triggers a real re-sweep. The old
       "Sample" tag/disabled ticket-link styling is gone along with the mock
       data it existed for — every Coming Soon card now has a real "via
       SeatGeek" source and a working ticket link. Also removed the
       collapse/expand toggle added in v6 — Susan flagged it as unneeded
       once the section holds real, useful data instead of 6 fixed mock
       cards; the section is just always visible again, with its count
       badge kept since that part was genuinely useful. `cr_deleted_ids_v1`
       is renamed `cr_hidden_ids_v1` since it no longer just hides mock rows
       — it now needs to survive a live re-sweep too (a hidden real show
       stays hidden even after Refresh finds it again).
       v6: the Watching row's status badge was always a placeholder (see the
       v2 note: "purely so the concept is visible now — nothing is actually
       monitored yet") — but it read as a real, current answer, and once live
       search existed that placeholder started actively lying (e.g. showing
       "No matches yet" for Kruder & Dorfmeister right after a live search on
       this same page had just confirmed a real Fox Theater Oakland date).
       Fixed: the badge now only ever claims "In Coming Soon" — something
       provably true (checked against the real Coming Soon list, sample +
       any added-live shows) — and otherwise shows a "Check live →" button
       that runs an actual /api/tour-dates query for that artist/city right
       from the row (same function the main Search panel uses), instead of
       a static guess that can't know the real answer without querying.
       v5, all direct UI/UX feedback after the v4 live-search launch:
       - Removed the "N of N shows" line and the old local live-filter
         wiring on the Artist/City fields — those fields now do ONE thing
         (feed the live SeatGeek search), not double as a hidden filter over
         the Coming Soon sample list too. That dual-purpose is what made
         "6 of 6 shows" show up somewhere it didn't obviously belong.
       - Coming Soon is now a collapsible section (button + chevron,
         defaults collapsed, state remembered via localStorage
         cr_soon_open_v1) with a count badge in its own label so the number
         of shows is still visible without opening it.
       - Live search result cards gained an "Add to Coming Soon" button —
         confirmed real shows can now be pinned into the Coming Soon list
         instead of only living in a one-off search result. Added shows are
         tagged "Live" (green), never "Sample" (red/red-bordered) — keeps
         the same real-vs-sample visual distinction the rest of this page
         already relies on, just inside one shared list instead of two.
         Persisted via localStorage cr_added_shows_v1.
       - Cut the Watching panel's explanatory paragraph — it read like an
         internal build note ("Once the real matching function exists...")
         rather than something a person browsing the page needs.
       - The "Matched performer: X" line under live results now only shows
         when the match was a fuzzy/fallback one — an exact match doesn't
         need the caveat, so it's quieter in the common case.
       - Live results also gained a "+ Watch <artist>" action (once per
         matched artist, not per show — watching is an artist+city concept,
         not a per-date one) so a search that finds nothing upcoming still
         lets you start watching that artist right from the result, instead
         of re-typing the name into the separate Watching panel.
       v4: the "Coming Soon" list below is STILL a preview mock (sample
       data, see v1/v2/v3 notes) — but the Search card now also fires a REAL
       query against the new /api/tour-dates function (netlify/functions/
       tour-dates.mjs, SeatGeek-backed), added as its own "Live Results"
       section so real and sample data are never visually blended — the
       project's existing discipline (see CLAUDE.md, the "Preview — sample
       data" banner history) is not to let real and fake data look the same.
       - Added an explicit "Search" button (was previously live-filter-only
         via keystroke) — a real network call shouldn't fire on every
         keypress, so Search is now a deliberate action; Enter in the
         Artist field also triggers it.
       - Loading / error / empty states are all visible, persistent text
         (per CLAUDE.md's "No silent failures" rule) — no console-only
         failures, no setTimeout-hides-error.
       - Live cards show a "Live" tag + "via SeatGeek", a real working
         "Get tickets ↗" link (target=_blank), and — for transparency after
         the tribute-band false-match bug tour-dates.mjs v2 shipped with —
         a small "Matched: <performer>" line so it's always visible exactly
         which SeatGeek performer record the results came from.
       - City field now also filters the LIVE results client-side (server
         only takes an artist + a fixed Berkeley radius; city narrows what's
         displayed from that same result set).
       v3 changes, all per Susan's request, same session as v2:
       - Removed the "Preview — sample data, not real listings" banner and
         the "Matching artists from your collection..." intro line. The
         per-card "Sample" tag is now the only in-page signal this is mock
         data — the fuller explanation (why, what's fake, what's still
         needed) lives in CLAUDE.md's 2026-08-03 entry instead, not on a
         page meant for browsing.
       - Removed the "What turns this into the real feature" section
         (the numbered build-out plan) for the same reason — read as
         internal build notes on a page meant for browsing. Kept verbatim
         in CLAUDE.md so nothing about the plan is lost.
       - Added a "Coming Soon" label above the show list.
       v2 changes, all client-side/localStorage, no schema or endpoint:
       - Artist/City filter panel (top third of the page), live-filters the
         list below as you type. Modeled on Travel Intelligence's
         Origin/Destination field pair (travelintelligence.org) for a
         familiar 2-field layout rather than one ambiguous combined box.
       - Watching panel, styled after Travel Intelligence's "Watched Trips"
         box (label, a row per watched thing, a delete × per row, an add
         form below). Here it's an artist + optional city instead of a
         route; status per row checks against the sample shows below
         ("Match in sample data" / "No matches yet") purely so the concept
         is visible now — nothing is actually monitored yet. Persisted in
         localStorage (key cr_watching_v1), the same pattern wishlist.html
         already uses for its own UI-only state (sort mode + weight choice).
       - Per-show delete (×): removes a card from view, persisted via
         localStorage (key cr_deleted_ids_v1) so it stays gone on reload.
         A "Restore deleted sample shows" link appears once anything's been
         removed, since every deletion here is against fake data anyway —
         no reason to make that irreversible during review.
       - Removed the "~N mi away" distance line per Susan's request.
       - Added a price range line per card (e.g. "$95 – $310") — standard
         Ticketmaster/SeatGeek listing convention, easier to fabricate
         consistently than a single "average" figure and matches what both
         real APIs actually return.
       - Cards are now rendered from a small JS data array instead of
         static HTML, so filtering/deleting has something to operate on.
       v1 (2026-08-03): initial static mock, no controls — plain list of
       6 fictional shows, real venues, invented dates/lineups, "~mi away"
       distance line (now removed, see above). See CLAUDE.md's 2026-08-03
       entry and roadmap.html's Phase 11 for what "real" looks like.
       HOME_LOCATION hardcoded to Berkeley, CA per Susan's explicit choice
       — moves into the matching function, not a page, once this is real. */
    .cr-wrap { max-width: 860px; margin: 0 auto; padding: 0 32px 90px; }

    .cr-panel__label { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 12px; }

    .cr-input { width: 100%; font-family: var(--mono); font-size: 16px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 2px; background: var(--bg); color: var(--ink); min-height: 44px; box-sizing: border-box; }

    .cr-watch-inline-btn:hover { background: var(--ink); color: var(--bg); }

        <div class="cr-field">
          <label for="cr-f-artist">Artist</label>
          <input type="text" id="cr-f-artist" class="cr-input" placeholder="e.g. Kraftwerk" autocomplete="off" />
        </div>
        <div class="cr-field">
          <label for="cr-f-city">City</label>
          <input type="text" id="cr-f-city" class="cr-input" placeholder="e.g. Oakland" autocomplete="off" />
        </div>
      </div>
      <div class="cr-search-actions">
        <button type="button" id="cr-search-btn" class="cr-search-btn">Search live listings</button>
        <button type="button" id="cr-clear" class="cr-clear" hidden>Clear</button>
      </div>
    </div>

    <div class="cr-panel">
      <h3 class="cr-panel__label">Watching</h3>
      <div id="cr-watch-list" class="cr-watch-list"></div>
      <div class="cr-watch-add">
        <input type="text" id="cr-watch-artist" class="cr-input" placeholder="Artist to watch" autocomplete="off" />
        <div class="cr-watch-add-row2">
          <input type="text" id="cr-watch-city" class="cr-input" placeholder="City (optional)" autocomplete="off" />
          <button type="button" id="cr-watch-add-btn" class="cr-watch-btn">Watch</button>
        </div>
      </div>
    </div>
  </div>

  <section id="cr-live" class="cr-live" hidden>
    <h3 class="cr-section-label">Live Results</h3>
    <div id="cr-live-body"></div>
  </section>

  <div class="cr-soon-head">
    <h3 class="cr-section-label">Coming Soon <span id="cr-soon-count" class="cr-soon-count"></span></h3>
    <button type="button" id="cr-soon-refresh" class="cr-clear">Refresh</button>
  </div>
  <p id="cr-soon-status" class="cr-soon-status"></p>
  <div id="cr-list" class="cr-list"></div>

</main>

<footer class="site-footer">
  <div class="wrap">&copy; 2026</div>
</footer>

<script>
(function(){
  var LS_HIDDEN = 'cr_hidden_ids_v1';
  var LS_WATCH = 'cr_watching_v1';
  var LS_ADDED = 'cr_added_shows_v1';
  var LS_CACHE = 'cr_catalog_cache_v1';
  var CACHE_MAX_AGE_MS = 12 * 60 * 60 * 1000; // 12h — re-sweep automatically once stale
  var SWEEP_CONCURRENCY = 5; // parallel /api/tour-dates calls during a catalog sweep

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); }
    catch (e) { return []; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); }
    catch (e) { /* storage unavailable — deletes/watches just won't persist this session */ }
  }

  var hidden = loadJSON(LS_HIDDEN);
  var watching = loadJSON(LS_WATCH);
  var addedShows = loadJSON(LS_ADDED);

  // catalogShows = the result of the last full sweep of every distinct
  // artist in the collection + wishlist through /api/tour-dates. Loaded from
  // a localStorage cache first (instant) and refreshed in the background if
  // stale — see sweepCatalog() below.
  var catalogCache = (function () {
    try { return JSON.parse(localStorage.getItem(LS_CACHE) || 'null'); }
    catch (e) { return null; }
  })();
  var catalogShows = (catalogCache && Array.isArray(catalogCache.shows)) ? catalogCache.shows : [];

  var els = {
    artistInput: document.getElementById('cr-f-artist'),
    cityInput: document.getElementById('cr-f-city'),
    clearBtn: document.getElementById('cr-clear'),
    list: document.getElementById('cr-list'),
    watchList: document.getElementById('cr-watch-list'),
    watchArtistInput: document.getElementById('cr-watch-artist'),
    watchCityInput: document.getElementById('cr-watch-city'),
    watchAddBtn: document.getElementById('cr-watch-add-btn'),
    searchBtn: document.getElementById('cr-search-btn'),
    live: document.getElementById('cr-live'),
    liveBody: document.getElementById('cr-live-body'),
    soonCount: document.getElementById('cr-soon-count'),
    soonStatus: document.getElementById('cr-soon-status'),
    soonRefresh: document.getElementById('cr-soon-refresh')
  };

  function fmtPrice(low, high) {
    return '$' + low.toLocaleString() + ' – $' + high.toLocaleString();
  }

  function fmtAgo(ts) {
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    var days = Math.round(hrs / 24);
    return days + (days === 1 ? ' day ago' : ' days ago');
  }

  // Coming Soon = real shows found by sweeping the collection + wishlist
  // (minus anything hidden) plus any shows manually pinned from an ad-hoc
  // live search (minus any the user's since removed). Every item carries
  // which kind it is (`_kind`) so delete can tell a re-computed catalog
  // match from a one-off pinned one apart.
  function comingSoonShows() {
    var fromCatalog = catalogShows.filter(function (s) { return hidden.indexOf(s.id) === -1; })
      .map(function (s) { return Object.assign({ _kind: 'catalog' }, s); });
    var fromAdded = addedShows.map(function (s) { return Object.assign({ _kind: 'added' }, s); });
    // De-dupe: a manually-added show that the catalog sweep also finds
    // shouldn't render twice.
    var seen = {};
    return fromCatalog.concat(fromAdded).filter(function (s) {
      if (seen[s.id]) return false;
      seen[s.id] = true;
      return true;
    }).sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  }

  // Groups same artist + same venue into one card with a date range instead
  // of a repeated row per date (e.g. a 7-night Buena Vista Social Club
  // residency was rendering as 7 near-identical cards). Only groups
  // catalog-sourced shows — manually pinned ("added") shows stay one-per-
  // card since they were each deliberately picked individually.
  function groupCatalogShows(items) {
    var order = [];
    var byKey = {};
    items.forEach(function (s) {
      var key = (s.artist || '').toLowerCase() + '|' + (s.venue || '').toLowerCase();
      if (!byKey[key]) { byKey[key] = []; order.push(key); }
      byKey[key].push(s);
    });
    return order.map(function (key) {
      var list = byKey[key].slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
      var seenDates = {};
      return list.filter(function (s) {
        if (seenDates[s.date]) return false;
        seenDates[s.date] = true;
        return true;
      });
    });
  }

  // Parses a YYYY-MM-DD string into a LOCAL Date built from its literal
  // Y/M/D components — NOT `new Date(iso)`, which parses as UTC midnight
  // and can land on the previous calendar day once converted to Pacific
  // time (exactly the kind of off-by-one this project's history warns
  // about — see CLAUDE.md's audio-preview matching saga for the general
  // "verify, don't assume" lesson this rhymes with).
  function parseISODateLocal(iso) {
    var p = (iso || '').split('-');
    if (p.length !== 3) return null;
    var y = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, d = parseInt(p[2], 10);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
    return new Date(y, m, d);
  }

  function fmtDateRange(items) {
    if (items.length === 1) return items[0].dateLabel || items[0].date || '';
    var first = items[0], last = items[items.length - 1];
    var fd = parseISODateLocal(first.date), ld = parseISODateLocal(last.date);
    if (!fd || !ld) return (first.dateLabel || first.date || '') + ' – ' + (last.dateLabel || last.date || '');
    var sameMonthYear = fd.getFullYear() === ld.getFullYear() && fd.getMonth() === ld.getMonth();
    var range = sameMonthYear
      ? fd.toLocaleDateString('en-US', { month: 'short' }) + ' ' + fd.getDate() + '–' + ld.getDate() + ', ' + fd.getFullYear()
      : fd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' – ' + ld.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    return range + ' · ' + items.length + ' dates';
  }

  function renderCard(items) {
    var s = items[0];
    var ids = items.map(function (it) { return it.id; });
    var cta = s.url ? '<a class="cr-live-cta" href="' + esc(s.url) + '" target="_blank" rel="noopener">Get tickets ↗</a>' : '';
    var already = isWatching(s.artist);
    var watchBtn = '<button type="button" class="cr-watch-inline-btn" data-watch-artist="' + esc(s.artist) + '" data-watch-city="' + esc(s.city || '') + '"' +
      (already ? ' disabled' : '') + '>' + (already ? 'Watching ✓' : '+ Watch') + '</button>';
    var lows = items.map(function (it) { return it.priceLow; }).filter(function (n) { return typeof n === 'number'; });
    var highs = items.map(function (it) { return it.priceHigh; }).filter(function (n) { return typeof n === 'number'; });
    var hasPrice = lows.length && highs.length;
    return '<div class="cr-item" data-id="' + esc(ids.join(',')) + '" data-kind="' + esc(s._kind) + '">' +
      '<div class="cr-who">' +
        '<div class="cr-artist">' + esc(s.artist) + '</div>' +
        '<div class="cr-venue">' + esc(s.venue || 'Venue TBA') + (s.city ? ' — ' + esc(s.city) : '') + '</div>' +
        '<div class="cr-tags"><span class="cr-source">via ' + esc(s.source || 'SeatGeek') + '</span></div>' +
        '<div class="cr-live-actions">' + cta + watchBtn + '</div>' +
      '</div>' +
      '<div class="cr-meta">' +
        '<div class="cr-date">' + esc(fmtDateRange(items)) + '</div>' +
        (hasPrice ? '<div class="cr-price">' + fmtPrice(Math.min.apply(null, lows), Math.max.apply(null, highs)) + '</div>' : '') +
      '</div>' +
      '<button type="button" class="cr-item-del" aria-label="Remove ' + esc(s.artist) + ' from the list" data-del="' + esc(ids.join(',')) + '" data-kind="' + esc(s._kind) + '">&times;</button>' +
    '</div>';
  }

  function renderList() {
    // Watched artists are excluded here — their date/price already shows
    // inline in the Watching panel (findWatchMatches still reads the full,
    // unfiltered comingSoonShows() below), so showing the same show again
    // as a Coming Soon card too would just be a duplicate.
    var shows = comingSoonShows().filter(function (s) { return !isShowWatched(s.artist); });

    if (!shows.length) {
      els.soonCount.textContent = '(0)';
      var allShows = comingSoonShows();
      els.list.innerHTML = allShows.length
        ? '<div class="cr-empty">Every upcoming show found is for an artist you\'re already watching — see the Watching panel above.</div>'
        : '<div class="cr-empty">No upcoming shows found for your collection & wishlist near Berkeley yet.</div>';
    } else {
      var catalogGroups = groupCatalogShows(shows.filter(function (s) { return s._kind === 'catalog'; }));
      var addedSingles = shows.filter(function (s) { return s._kind === 'added'; }).map(function (s) { return [s]; });
      var units = catalogGroups.concat(addedSingles).sort(function (a, b) {
        return (a[0].date || '').localeCompare(b[0].date || '');
      });
      // Count reflects what's actually on screen (cards, i.e. distinct
      // artist+venue bookings) rather than the raw per-date show total —
      // otherwise "(19)" next to 13 visible cards reads as a bug.
      els.soonCount.textContent = '(' + units.length + ')';
      els.list.innerHTML = units.map(renderCard).join('');
    }

    renderWatchList();
  }

  function findWatchMatches(name) {
    var q = name.trim().toLowerCase();
    if (!q) return [];
    return comingSoonShows().filter(function (s) {
      var a = s.artist.toLowerCase();
      return a.indexOf(q) !== -1 || q.indexOf(a) !== -1;
    }).sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  }

  function isWatching(artist) {
    var q = artist.trim().toLowerCase();
    return watching.some(function (w) { return w.artist.toLowerCase() === q; });
  }

  // Either/or rule: a show whose artist is already being watched doesn't
  // get its own Coming Soon card — the Watching panel's inline date/price
  // is the one place it shows up. Same loose substring match as
  // findWatchMatches() (not the stricter exact match isWatching() uses for
  // button state) so the hidden set and what the Watching panel displays
  // never disagree.
  function isShowWatched(artist) {
    var a = (artist || '').trim().toLowerCase();
    if (!a) return false;
    return watching.some(function (w) {
      var q = w.artist.trim().toLowerCase();
      return a.indexOf(q) !== -1 || q.indexOf(a) !== -1;
    });
  }

  function renderWatchList() {
    if (!watching.length) {
      els.watchList.innerHTML = '<p class="cr-watch-empty">Not watching any artists yet.</p>';
      return;
    }
    els.watchList.innerHTML = watching.map(function (w, i) {
      var matches = findWatchMatches(w.artist);
      // A watched artist either already has confirmed show(s) in Coming
      // Soon — in which case show the actual date(s) and price right here,
      // not just a badge that makes you go scroll and find it yourself —
      // or it doesn't, in which case the honest answer is "we don't know
      // yet," so offer a real live check instead of a static guess.
      var statusHtml;
      if (matches.length) {
        var lows = matches.map(function (m) { return m.priceLow; }).filter(function (n) { return typeof n === 'number'; });
        var highs = matches.map(function (m) { return m.priceHigh; }).filter(function (n) { return typeof n === 'number'; });
        var hasPrice = lows.length && highs.length;
        // Ticket link points at the earliest matched date (matches is
        // already sorted ascending), same convention as a grouped Coming
        // Soon card's own ticket link.
        var ticketUrl = matches.map(function (m) { return m.url; }).filter(Boolean)[0];
        statusHtml = '<div class="cr-watch-info">' +
          '<div class="cr-watch-date">' + esc(fmtDateRange(matches)) + '</div>' +
          (hasPrice ? '<div class="cr-watch-price">' + esc(fmtPrice(Math.min.apply(null, lows), Math.max.apply(null, highs))) + '</div>' : '') +
          (ticketUrl ? '<a class="cr-watch-cta" href="' + esc(ticketUrl) + '" target="_blank" rel="noopener">Get tickets ↗</a>' : '') +
        '</div>';
      } else {
        statusHtml = '<button type="button" class="cr-watch-check" data-watch-check="' + i + '">Check live &#8594;</button>';
      }
      // Artist name + delete button share a top row (delete always stays
      // put, never pushed onto its own orphaned line); date/price/ticket
      // link flow on their own full-width row below, so a long date range
      // (e.g. "Feb 6–20, 2027 · 7 dates") has room to wrap without
      // widowing the × — the bug a 7-night Buena Vista Social Club
      // residency exposed.
      return '<div class="cr-watch-row">' +
        '<div class="cr-watch-top">' +
          '<div class="cr-watch-who">' +
            '<div class="cr-watch-artist">' + esc(w.artist) + '</div>' +
            (w.city ? '<div class="cr-watch-city">' + esc(w.city) + '</div>' : '') +
          '</div>' +
          '<button type="button" class="cr-watch-del" aria-label="Stop watching ' + esc(w.artist) + '" data-watch-del="' + i + '">&times;</button>' +
        '</div>' +
        statusHtml +
      '</div>';
    }).join('');
  }

  els.clearBtn.addEventListener('click', function () {
    els.artistInput.value = '';
    els.cityInput.value = '';
    els.live.hidden = true;
    els.liveBody.innerHTML = '';
    els.clearBtn.hidden = true;
    els.artistInput.focus();
  });

  els.list.addEventListener('click', function (e) {
    var watchBtn = e.target.closest('[data-watch-artist]');
    if (watchBtn) {
      // addWatch() re-renders the whole list itself — the either/or rule
      // means this card (and any sibling dates in its group) may need to
      // disappear from Coming Soon now that its artist is watched, so a
      // simple button-state toggle here isn't enough.
      addWatch(watchBtn.getAttribute('data-watch-artist'), watchBtn.getAttribute('data-watch-city'));
      return;
    }
    var btn = e.target.closest('[data-del]');
    if (!btn) return;
    // A grouped card (e.g. a multi-night residency) carries every
    // underlying show id comma-joined — removing the card removes all of
    // them, not just the first.
    var ids = btn.getAttribute('data-del').split(',');
    var kind = btn.getAttribute('data-kind');
    if (kind === 'added') {
      addedShows = addedShows.filter(function (s) { return ids.indexOf(s.id) === -1; });
      saveJSON(LS_ADDED, addedShows);
    } else {
      ids.forEach(function (id) { if (hidden.indexOf(id) === -1) hidden.push(id); });
      saveJSON(LS_HIDDEN, hidden);
    }
    renderList();
  });

  // Shared by the Watching panel's own form AND the "+ Watch <artist>"
  // button on live search results.
  function addWatch(artist, city) {
    artist = (artist || '').trim();
    if (!artist) return false;
    city = (city || '').trim();
    if (isWatching(artist)) return false;
    watching.push({ artist: artist, city: city });
    saveJSON(LS_WATCH, watching);
    // Full re-render (not just the Watching panel) — watching an artist can
    // remove Coming Soon card(s) it already had, under the either/or rule.
    renderList();
    return true;
  }

  function submitWatchForm() {
    var artist = els.watchArtistInput.value.trim();
    if (!artist) { els.watchArtistInput.focus(); return; }
    addWatch(artist, els.watchCityInput.value.trim());
    els.watchArtistInput.value = '';
    els.watchCityInput.value = '';
    els.watchArtistInput.focus();
  }

  els.watchAddBtn.addEventListener('click', submitWatchForm);
  els.watchArtistInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitWatchForm(); });
  els.watchCityInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitWatchForm(); });

  els.watchList.addEventListener('click', function (e) {
    var delBtn = e.target.closest('[data-watch-del]');
    if (delBtn) {
      var idx = parseInt(delBtn.getAttribute('data-watch-del'), 10);
      watching.splice(idx, 1);
      saveJSON(LS_WATCH, watching);
      // Full re-render, not just the Watching panel — un-watching an artist
      // can bring its card(s) back into Coming Soon under the either/or rule.
      renderList();
      return;
    }
    var checkBtn = e.target.closest('[data-watch-check]');
    if (checkBtn) {
      var w = watching[parseInt(checkBtn.getAttribute('data-watch-check'), 10)];
      if (!w) return;
      els.artistInput.value = w.artist;
      els.cityInput.value = w.city || '';
      runLiveSearch();
      els.live.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
  });

  // --- Live search: real query against /api/tour-dates (SeatGeek-backed). ---
  // Kept in its own section, never merged into the SHOWS sample list above —
  // this codebase's established discipline is to never let real and sample
  // data look the same (see CLAUDE.md's "Preview — sample data" history).

  function showLiveStatus(msg, isError) {
    els.liveBody.innerHTML = '<div class="cr-live-status' + (isError ? ' is-error' : '') + '">' + esc(msg) + '</div>';
  }

  // Full show objects from the last render, keyed by id, so the delegated
  // click handler below can look one up when "Add to Coming Soon" is clicked
  // without re-parsing anything out of the DOM.
  var lastLiveShowsById = {};

  function watchRowHtml(artist, city) {
    var already = isWatching(artist);
    return '<div class="cr-live-watch-row">' +
      '<button type="button" class="cr-watch-inline-btn" data-watch-artist="' + esc(artist) + '" data-watch-city="' + esc(city || '') + '"' +
      (already ? ' disabled' : '') + '>' + (already ? 'Watching ✓' : '+ Watch ' + esc(artist)) + '</button>' +
    '</div>';
  }

  function renderLiveResults(shows, meta, queriedArtist) {
    var cityQ = els.cityInput.value.trim().toLowerCase();
    var filtered = (shows || []).filter(function (s) {
      if (!cityQ) return true;
      return (s.city || '').toLowerCase().indexOf(cityQ) !== -1 ||
        (s.venue || '').toLowerCase().indexOf(cityQ) !== -1;
    });

    // Only surface the "matched performer" line when the match was a fuzzy
    // fallback — an exact match doesn't need the caveat.
    var matchedLine = (meta.matched_performer && meta.match_tier === 'fuzzy')
      ? '<div class="cr-live-matched">Closest match: ' + esc(meta.matched_performer) + ' — double-check before trusting</div>'
      : '';

    if (!meta.matched_performer) {
      els.liveBody.innerHTML = matchedLine +
        '<div class="cr-live-status">No SeatGeek performer found matching “' + esc(queriedArtist) +
        '.” Try the exact act name (as billed, not a nickname).</div>';
      return;
    }

    var watchRow = watchRowHtml(meta.matched_performer, els.cityInput.value.trim());

    if (!filtered.length) {
      els.liveBody.innerHTML = matchedLine + watchRow +
        '<div class="cr-live-status">No upcoming ' + esc(meta.matched_performer) + ' shows found within ' +
        esc(meta.range || 'range') + ' of Berkeley' +
        (cityQ ? ' matching “' + esc(els.cityInput.value.trim()) + '”' : '') + '.</div>';
      return;
    }

    lastLiveShowsById = {};
    filtered.forEach(function (s) { lastLiveShowsById[s.id] = s; });

    els.liveBody.innerHTML = matchedLine + watchRow + filtered.map(function (s) {
      var hasPrice = typeof s.priceLow === 'number' && typeof s.priceHigh === 'number';
      var added = addedShows.some(function (a) { return a.id === s.id; });
      return '<div class="cr-live-item">' +
        '<div class="cr-who">' +
          '<div class="cr-artist">' + esc(s.artist || meta.matched_performer) + '</div>' +
          '<div class="cr-venue">' + esc(s.venue || 'Venue TBA') + (s.city ? ' — ' + esc(s.city) : '') + '</div>' +
          '<div class="cr-tags"><span class="cr-live-tag">Live</span><span class="cr-source">via ' + esc(s.source || 'SeatGeek') + '</span></div>' +
          '<div class="cr-live-actions">' +
            (s.url ? '<a class="cr-live-cta" href="' + esc(s.url) + '" target="_blank" rel="noopener">Get tickets ↗</a>' : '') +
            '<button type="button" class="cr-live-add-btn" data-add-show="' + esc(s.id) + '"' + (added ? ' disabled' : '') + '>' +
              (added ? 'Added ✓' : '+ Add to Coming Soon') +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div class="cr-meta">' +
          '<div class="cr-date">' + esc(s.dateLabel || s.date || 'Date TBA') + '</div>' +
          (hasPrice ? '<div class="cr-price">' + fmtPrice(s.priceLow, s.priceHigh) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  els.liveBody.addEventListener('click', function (e) {
    var watchBtn = e.target.closest('[data-watch-artist]');
    if (watchBtn) {
      // Live Results has its own DOM, untouched by renderList() — flip this
      // button's own state manually. addWatch() itself re-renders Coming
      // Soon + the Watching panel (either/or rule may hide card(s) this
      // artist already had showing in Coming Soon).
      addWatch(watchBtn.getAttribute('data-watch-artist'), watchBtn.getAttribute('data-watch-city'));
      watchBtn.textContent = 'Watching ✓';
      watchBtn.disabled = true;
      return;
    }
    var addBtn = e.target.closest('[data-add-show]');
    if (addBtn) {
      var id = addBtn.getAttribute('data-add-show');
      var show = lastLiveShowsById[id];
      if (show && !addedShows.some(function (a) { return a.id === id; })) {
        addedShows.push(show);
        saveJSON(LS_ADDED, addedShows);
        renderList();
        addBtn.textContent = 'Added ✓';
        addBtn.disabled = true;
      }
      return;
    }
  });

  var liveSearchInFlight = false;
  function runLiveSearch() {
    if (liveSearchInFlight) return;
    var artist = els.artistInput.value.trim();
    els.live.hidden = false;
    els.clearBtn.hidden = false;
    if (!artist) {
      showLiveStatus('Enter an artist name above, then search.', true);
      els.artistInput.focus();
      return;
    }
    liveSearchInFlight = true;
    els.searchBtn.disabled = true;
    els.searchBtn.textContent = 'Searching…';
    showLiveStatus('Searching SeatGeek for “' + artist + '” near Berkeley…', false);

    fetch('/api/tour-dates?artist=' + encodeURIComponent(artist))
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function (r) {
        if (!r.ok) {
          showLiveStatus((r.data && r.data.error) ? r.data.error : ('Search failed (HTTP ' + r.status + ').'), true);
          return;
        }
        renderLiveResults(r.data.shows, r.data.meta || {}, artist);
      })
      .catch(function (err) {
        showLiveStatus('Could not reach the search endpoint: ' + err.message, true);
      })
      .finally(function () {
        liveSearchInFlight = false;
        els.searchBtn.disabled = false;
        els.searchBtn.textContent = 'Search live listings';
      });
  }

  els.searchBtn.addEventListener('click', runLiveSearch);
  els.artistInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') runLiveSearch(); });
  els.cityInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') runLiveSearch(); });

  // --- Catalog sweep: real Coming Soon data, sourced from the collection
  // and wishlist rather than a static mock list. Every distinct artist name
  // across both gets a real /api/tour-dates lookup (same endpoint the
  // Search panel uses), run with limited concurrency so a ~100-artist
  // catalog doesn't fire 100 simultaneous requests. Results are cached in
  // localStorage with a timestamp so a normal page visit is instant; the
  // sweep itself only re-runs automatically once the cache goes stale
  // (12h) or the user clicks Refresh. An artist with no confirmed match is
  // silently omitted — same graceful-degradation rule as audio-preview's
  // Deezer/YouTube tiers (see CLAUDE.md): never treat "no match" as an
  // error, only "the request itself failed" is.

  function saveCache(shows, artistCount) {
    catalogCache = { at: Date.now(), shows: shows, artistCount: artistCount };
    try { localStorage.setItem(LS_CACHE, JSON.stringify(catalogCache)); } catch (e) {}
  }

  // Runs `iterator` over `items` with at most `limit` in flight at once.
  // Never rejects — a failing item resolves to `fallback` instead, so one
  // bad artist lookup can't derail the whole sweep.
  function mapLimit(items, limit, iterator, onItemDone) {
    return new Promise(function (resolve) {
      if (!items.length) { resolve([]); return; }
      var results = new Array(items.length);
      var nextIndex = 0;
      var completed = 0;
      function runNext() {
        if (nextIndex >= items.length) return;
        var i = nextIndex++;
        Promise.resolve(iterator(items[i], i))
          .then(function (r) { results[i] = r; })
          .catch(function () { results[i] = null; })
          .then(function () {
            completed++;
            if (onItemDone) onItemDone(completed, items.length);
            if (completed === items.length) resolve(results);
            else runNext();
          });
      }
      for (var k = 0; k < Math.min(limit, items.length); k++) runNext();
    });
  }

  function fetchDistinctArtists() {
    return Promise.all([
      fetch('/api/records').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
      fetch('/api/wishlist').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })
    ]).then(function (results) {
      var records = Array.isArray(results[0]) ? results[0] : [];
      var wishlist = Array.isArray(results[1]) ? results[1] : [];
      var seen = {};
      var names = [];
      records.concat(wishlist).forEach(function (item) {
        var name = (item && item.artist ? String(item.artist) : '').trim();
        if (!name) return;
        var key = name.toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        names.push(name);
      });
      return names;
    });
  }

  var sweepInFlight = false;
  function sweepCatalog() {
    if (sweepInFlight) return;
    sweepInFlight = true;
    els.soonRefresh.disabled = true;
    els.soonStatus.textContent = 'Checking your collection & wishlist for artists…';

    fetchDistinctArtists().then(function (artists) {
      if (!artists.length) {
        els.soonStatus.textContent = 'No artists found in your collection or wishlist yet.';
        catalogShows = [];
        saveCache(catalogShows, 0);
        renderList();
        return;
      }

      els.soonStatus.textContent = 'Checking 0 of ' + artists.length + ' artists for tour dates…';

      return mapLimit(artists, SWEEP_CONCURRENCY, function (artist) {
        return fetch('/api/tour-dates?artist=' + encodeURIComponent(artist))
          .then(function (res) { return res.ok ? res.json() : { shows: [] }; })
          .then(function (data) { return Array.isArray(data.shows) ? data.shows : []; })
          .catch(function () { return []; });
      }, function (completed, total) {
        els.soonStatus.textContent = 'Checking ' + completed + ' of ' + total + ' artists for tour dates…';
      }).then(function (perArtistShows) {
        var all = [];
        perArtistShows.forEach(function (list) { if (list) all = all.concat(list); });
        // De-dupe by id in case the same show surfaced under two different
        // artist queries (e.g. a co-headline bill in both the catalog and
        // the wishlist).
        var seenIds = {};
        catalogShows = all.filter(function (s) {
          if (!s || !s.id || seenIds[s.id]) return false;
          seenIds[s.id] = true;
          return true;
        });
        saveCache(catalogShows, artists.length);
        els.soonStatus.textContent = 'Checked ' + artists.length + ' artists · just now';
        renderList();
      });
    }).catch(function (err) {
      els.soonStatus.textContent = 'Could not check your collection & wishlist: ' + err.message;
    }).then(function () {
      sweepInFlight = false;
      els.soonRefresh.disabled = false;
    });
  }

  els.soonRefresh.addEventListener('click', sweepCatalog);

  // First render: show whatever's cached (instant) — even if empty — then
  // decide whether a fresh sweep is needed.
  renderList();
  if (catalogCache && typeof catalogCache.at === 'number') {
    var age = Date.now() - catalogCache.at;
    els.soonStatus.textContent = 'Checked ' + (catalogCache.artistCount || 0) + ' artists · ' + fmtAgo(catalogCache.at);
    if (age > CACHE_MAX_AGE_MS) sweepCatalog();
  } else {
    sweepCatalog();
  }
})();
</script>

</body>
</html>
