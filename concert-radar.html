    /* Concert Radar — version: 17 (2026-08-04).
       v17: Two more fixes, same day, right after v16 deployed. Full
       narrative in CLAUDE.md's "v16.1"/this entry's notes — kept brief
       here since this comment block is already long.
       (1) Coming Soon showed cards with the literal artist name "null",
       some merging dozens of distinct real shows into one mega-date card
       (The Chapel: 77 "dates"; Cornerstone: 19). Root cause: a sweep that
       ran between v15 shipping and v16's crash fix landing saved real,
       un-normalized venue-shows.mjs data to the browser's cache before
       crashing — normalization only ran inside a live sweep, never on
       cache load, so the poisoned snapshot kept redisplaying. Fixed at the
       actual source (venue-shows.mjs v2 now defaults artist to title in
       its own response) and the cache key bumped (v1 -> v2) so every
       browser's already-poisoned snapshot is ignored rather than needing
       individual repair. Also: The Castro's film screenings ("Aliens
       (Special Edition)") were rendering as Coming Soon cards — new
       NON_MUSIC_WORDS blocklist in venue-shows.mjs filters those out.
       (2) The Watching panel's "Check live →" button (and the manual
       Search panel it shares runLiveSearch() with) only ever queried
       /api/tour-dates (SeatGeek) — exactly the source that has zero events
       for Black Uhuru / Easy Star All-Stars / Burning Spear, which is the
       whole reason /api/venue-shows exists. Now queries both in parallel
       and folds in any venue-shows result whose artist substring-matches
       the search, same loose match findWatchMatches() already uses.
       v16: Three changes, same day as v15 shipped, all found/requested in
       one live-review pass right after v15 deployed.
       (1) BUG, live-caught by Susan minutes after v15 deployed ("you broke
       this"): venue-shows.mjs only sets `artist` for the APE parser — the
       other six venue parsers (Cornerstone, Freight & Salvage, Sweetwater,
       the two See Tickets venues, UC Theatre) only ever had a `title`, so
       venue-shows.mjs's shape-normalizer at the bottom of that file wrote
       `artist: null` for all of them. The v15 merge in this file concats
       those straight into the same list `renderCard()`/`isWatching()`
       consume, and `isWatching()` did `artist.trim()` with no null guard
       (unlike `isShowWatched()` right next to it, which already does
       `(artist || '').trim()`) — so the very first render after the sweep
       resolved threw `Cannot read properties of null (reading 'trim')`,
       caught by the outer sweep `.catch()`, which replaced the status line
       with that raw error and left Coming Soon stuck on stale cached data.
       Fixed at the actual source: the merge step now defaults
       `s.artist = s.artist || s.title` for every venue-sourced show before
       it ever reaches render, so a card always has a real display name
       instead of the literal string "null" (`esc()` stringifies whatever
       it's given). `isWatching()` and `findWatchMatches()` also got the
       same defensive `(x || '')` guard `isShowWatched()` already used —
       belt and suspenders, not just the one fix, same discipline as every
       other "verify what actually broke, then fix it generally" note in
       this file's history.
       (2) BUG: the venue-shows.mjs fetch in the sweep lived inside the
       `if (!artists.length) return …` early-return branch, so Refresh
       never actually re-scraped the 7 venues added that same morning when
       the catalog/wishlist artist list came back empty — reported directly
       ("the Refresh link should also scrape the sites you set up this
       morning"). venue-shows.mjs owes the catalog/wishlist nothing (it's a
       fixed venue list, not an artist lookup), so the fetch is now kicked
       off immediately in `sweepCatalog()`, in parallel with the artist
       lookup, and merged in on both the empty-artists path and the normal
       path.
       (3) BUG, reported minutes later via screenshot: the Watching panel
       (4 real artists — Thievery Corporation, Kruder & Dorfmeister, Steel
       Pulse, Buena Vista Social Club) had gone completely empty in the
       same browser/profile Susan always uses, within about 10 minutes of
       normal use — "the page should retain info between sessions, today it
       seems to remove everything." No code path in this file ever called
       localStorage.clear() or overwrote cr_watching_v1 with `[]` — the
       most likely explanation is something outside this app's control
       (a private window, a browser-level storage eviction) wiping the one
       and only copy, which is precisely the risk of keeping real user data
       in nothing but browser-local storage. Susan asked directly to move
       Watching server-side, same pattern the wishlist already uses. New
       `netlify/functions/watching.mjs` (ungated, same rationale as
       wishlist.mjs v2 — casual mobile use, no passphrase friction; separate
       Blobs store so a bug here can't touch the catalog or wishlist) now
       owns Watching. `watching` is loaded via `GET /api/watching` on page
       load instead of localStorage; `addWatch()` and the delete handler now
       POST/DELETE against it instead of writing localStorage. The old
       `cr_watching_v1` key is left alone (harmless, unread going forward)
       rather than actively cleared, in case Susan's data is still sitting
       there and worth recovering by hand later.
       Same pass, a separate ask: Susan named 3 artists from her own list
       that fell outside every automated match (SeatGeek's per-artist sweep
       AND the new venue scrape) — Easy Star All-Stars, Black Uhuru, and
       Burning Spear — and asked for them to be remembered as artists to
       follow, not just logged in a doc. With Watching now server-side,
       these seed in durably: a one-time server-side check (gated by a
       `_meta_seed_v16_done` sentinel record in the same `watching` Blobs
       store — filtered out of every GET response, never rendered as a
       card) adds any of the three not already present, exactly once,
       regardless of which browser/device next loads the page — and,
       because the gate is server-side rather than a per-browser
       localStorage flag, it won't re-add one Susan deletes later from a
       different browser than the one that happened to run the seed. Black
       Uhuru seeds with city "Berkeley, CA" (its verified Freight & Salvage
       date, see v14 note below); Easy Star All-Stars and Burning Spear seed
       with no city — v14's research found no confirmed current Bay Area
       date for either, so a city would be a guess this file's "verify,
       don't assume" rule doesn't allow.
       v15: Susan asked to expand free feeds for full automatic coverage
       rather than rely on manual pinning. Researched every other
       free/self-serve concert-data API (Eventbrite's public search API has
       been dead since 2020 — confirmed still 403ing in 2026; Dice.fm only
       exposes a partner ticket-holder API, not discovery; PredictHQ has no
       free hobby tier; Bandsintown and Songkick both refuse/gate hobby
       access — Songkick's API application form is currently closed to new
       applicants entirely, not just under manual review). Ticketmaster
       Discovery API signup is in progress separately (self-serve, but
       Susan's account hit a signup snag being resolved directly with their
       support). With no other API path available, built a direct
       "watched venues" scraper instead: netlify/functions/venue-shows.mjs
       fetches each of 7 hand-picked Bay Area venues' own public event
       pages server-side and parses whatever the page already returns — no
       API key needed for any of them. Every venue was individually
       verified (2026-08-04) to actually serve its show data in the raw
       HTML response before being added — two venues Susan asked for,
       Ashkenaz and The New Parish, failed that check (both render via
       client-side JS/AJAX) and are deliberately left out rather than
       silently returning nothing; see venue-shows.mjs's own comments for
       the full per-venue platform breakdown and how to revisit those two.
       One of the 7 fetches (Another Planet Entertainment's own listing
       page) covers six venues in a single request — Fox Theater, Greek
       Theatre, Bill Graham Civic Auditorium, The Castro, Bimbo's 365 Club,
       and The Independent — since APE promotes all of them. This build's
       own reconnaissance found a concrete, previously-unknown second
       Black Uhuru date (Sep 13, 2026, Sweetwater Music Hall, Mill Valley)
       that neither SeatGeek nor a manual pin had ever surfaced — real
       proof this approach earns its keep. The sweep below now runs the
       existing per-artist SeatGeek query and one call to /api/venue-shows
       in parallel and merges both into the same Coming Soon list; no
       schema change was needed since venue-shows.mjs deliberately returns
       shows in the exact shape tour-dates.mjs already uses.
       v14: Susan named 3 real shows Coming Soon didn't have (Easy Star
       All-Stars at Cornerstone Berkeley, Black Uhuru, Burning Spear — all
       Bay Area). Investigated each directly against live data before
       changing anything (per PROJECT.md's "honesty over confidence" rule
       — don't fabricate, verify):
         - Easy Star All-Stars: IS in the catalog, so it's already being
           swept. /api/tour-dates?artist=Easy+Star+All-Stars resolves an
           exact SeatGeek performer match but returns zero events within
           60mi of Berkeley. Web research turned up no Bay Area/Cornerstone
           2026 date for this act — Cornerstone Berkeley's own upcoming
           listings don't include them either. The closest hit was "School
           of Rock AllStars" (a touring student ensemble, unrelated act)
           playing Cornerstone — flagged to Susan as a likely mix-up rather
           than added as if confirmed.
         - Burning Spear: also already in the catalog and already swept.
           Same result — exact performer match, zero SeatGeek events in
           range. Web research found no scheduled 2026 Bay Area date (only
           Reggae on the River in Piercy, well north of the Bay Area, and
           European fall dates). Flagged to Susan rather than assumed.
         - Black Uhuru: confirmed REAL — Feb 21, 2026, The Freight &
           Salvage, Berkeley (verified independently across Songkick,
           JamBase, AXS, Vivid Seats, Bandsintown, and the venue's own
           site). Not in the catalog or wishlist at all, so it was never
           swept in the first place — separately, SeatGeek's own API
           returns zero events for this exact performer within range too
           (Freight & Salvage's inventory doesn't appear to be on SeatGeek),
           so even watching it wouldn't have surfaced a match. This is the
           real, verified "SeatGeek coverage gap" CLAUDE.md's Concert Radar
           note said would justify a second source someday — logged there
           rather than silently added to, since wiring up a second ticket
           API (Ticketmaster) is a bigger build Susan hasn't asked for yet.
       What shipped instead, scoped to what's actually needed: a "+ Add a
       show Radar can't find" form under Coming Soon, so a real show with
       no SeatGeek listing can be pinned in directly (artist, date, ticket
       URL required; venue/city optional) — reuses the existing addedShows/
       localStorage pin mechanism a Live Results "+ Add to Coming Soon"
       click already writes to, just without requiring a SeatGeek hit
       first. Tagged "via Manual entry" (never "via SeatGeek") so sourcing
       stays honest — same discipline as the Live/Sample tag distinction
       this page has kept since v3. Also added `overflow-wrap: anywhere` to
       the venue/artist/watch-row text classes as a defensive fix for a
       reported "copyright looks off-center/cut off" mobile issue — most
       likely explained by a long unbroken venue string forcing horizontal
       overflow that html/body's global `overflow-x: hidden` then clips,
       shifting the centered footer relative to what's visible. Couldn't
       reproduce pixel-for-pixel in this pass (no true narrow-viewport
       render available), so flagged to Susan to confirm after deploy
       rather than claimed fixed with certainty. Mobile masthead nav (7
       links wrapping to 2 cramped rows on a phone) changed to a single
       horizontally-scrollable row instead — see style.css v28 — same
       pattern this repo already uses for the genre chip row.
       v13: Susan: "remove Watch and the artist/city boxes" — removed the
       manual "Artist to watch" / "City (optional)" / Watch mini-form that
       sat below the Watching list. Watching an artist now only happens via
       a "+ Watch" button — on a Coming Soon card, a Live Results card, or
       the Watching panel's own "Check live →" flow — never by typing a
       name in cold. addWatch() itself is unchanged (still the single path
       every one of those buttons calls into); only the standalone form's
       inputs, button, CSS, and event wiring are gone.
       v12: Get Tickets and +Watch buttons sat at two different heights
       wherever they appear side by side (Coming Soon cards, Live Results)
       — .cr-live-cta was min-height:44px, .cr-watch-inline-btn was 36px
       with padding-based sizing instead. Matched .cr-watch-inline-btn to
       the same 44px/inline-flex/box-sizing approach so both buttons in a
       row line up exactly. Also investigated Susan's "still no prices in
       Coming Soon" report: live-checked /api/tour-dates directly for all
       10 currently-matched real shows (Herbie Hancock, Diana Ross x2,
       Beck x2, Al Di Meola, Rhye, Bonobo, Thievery Corporation, Kruder &
       Dorfmeister, Steel Pulse, Buena Vista Social Club x7) — every one
       returns priceLow/priceHigh: null straight from SeatGeek's own API,

       stats.highest_price fields are read, and already render correctly

       as-is per Susan's "put aside for now" — no code change, since there
       is no real data to add without fabricating it.
       v11: two fixes to the Watching panel, live-review pass after v10
       shipped. (1) A long entry (Buena Vista Social Club's "Feb 6–20,
       2027 · 7 dates") was pushing the row's × onto its own orphaned line
       — the row used to be one flex line with the delete button as just
       another flex-wrap item, so once the date text got long enough it
       wrapped and stranded the × below with nothing next to it. Fixed by
       restructuring each row into two stacked pieces: a top line with
       artist+city on the left and × pinned top-right (always together,
       never wraps away from each other), and a full-width second line
       below for date/price/ticket-link, free to wrap on its own without
       threatening the delete button's position. (2) Watching rows now also
       show a price range and a real "Get tickets ↗" link (pointing at the
       earliest matched date's SeatGeek URL) — previously only the date was
       surfaced, even though the underlying show data already carried
       price/url the whole time.
       v10: Susan's rule — "if i'm watching an artist/concert, remove the
       instance from coming soon. its either or." A watched artist's shows
       no longer render as their own Coming Soon card(s) at all; the date/
       price the v9 Watching-panel change already surfaces inline is now the
       ONLY place they show up, instead of appearing in both places. Match
       logic for "is this show already covered by a watch" reuses the same
       loose substring comparison findWatchMatches() already used (handles
       minor name-formatting drift between a typed watch entry and a show's
       artist field), so the hidden set and the Watching-panel date/price
       are always the same set of shows. Clicking "+ Watch" on a Coming Soon
       card (or on a Live Results card, if that artist already has real
       Coming Soon cards showing) now re-renders the whole list immediately,
       since watching an artist can remove card(s) that were on screen a
       moment ago — previously that click only toggled the button's own
       text/disabled state in place, which no longer reflects reality once
       watching can hide cards.
       v9: Susan flagged Buena Vista Social Club appearing as 7 near-
       identical cards (one per night of a residency at the same venue).
       Coming Soon now groups same-artist + same-venue shows into a single
       card showing a date range ("Feb 6 – 20, 2027 · 7 dates") instead of
       one row per date — ticket link points at the earliest date, price
       shows the min/max across all dates in the group, and deleting the
       card hides every underlying show, not just the first. Only groups
       catalog-swept shows; a manually pinned ("+ Add to Coming Soon") show

       Same pass, three more direct requests:
       - Removed the "Restore hidden shows" link entirely, per Susan's
         request — hiding a real show is just final now, no undo UI. The
         underlying cr_hidden_ids_v1 mechanism is unchanged (a hidden show
         still won't reappear after a re-sweep), only the restore button
         and its wrapper are gone.
       - Added the standard site footer (`&copy; 2026`, same markup every
         other page uses) — this page never had one.
       - Watching rows now show the actual date (or date range, reusing the
         same grouping/range logic Coming Soon cards use) and price right
         in the row once a match exists, instead of a static "In Coming
         Soon" badge that told you a match existed but not what it was —
         Susan's point being she shouldn't have to scroll down and hunt for
         it herself.
       v8, two fixes from the same live-review pass:
       - Coming Soon cards gained a "+ Watch" button (parity with the one
         Live Results already had) — there was previously no way to start
         watching an artist directly from a Coming Soon card, only via the
         Watching panel's own form or from an ad-hoc Search result.
       - Companion fix lives in netlify/functions/tour-dates.mjs v4: Susan
         caught a real "Ultimate Sade Tribute Concert" rendering as a plain
         "Sade" show — a tribute act registered on SeatGeek under the bare
         artist name, which the exact-match performer check couldn't catch
         since the "tribute" language only ever showed up in the event's
         own title, which the matching logic wasn't checking. See that
         file's v4 note for the full fix (event-title-based blocklist,
         applied to every match regardless of tier).
       v7: Coming Soon is no longer the static 6-show mock array — it's now
       real data. On load (and every 12h after, or on demand via the new
       Refresh link), the page collects every distinct artist name across
       the catalog (/api/records) and wishlist (/api/wishlist), looks each
       one up through /api/tour-dates (concurrency-capped at 5 in flight so

       renders whatever real upcoming shows come back. An artist with no
       confirmed match is just omitted — never an error — same

       — moves into the matching function, not a page, once this is real. */
    .cr-wrap { max-width: 860px; margin: 0 auto; padding: 0 32px 90px; }

<script>
(function(){
  var LS_HIDDEN = 'cr_hidden_ids_v1';
  var LS_ADDED = 'cr_added_shows_v1';
  // v16.1: bumped v1 -> v2. A sweep run between v15 shipping and v16's crash
  // fix landing could fetch real venue-shows.mjs data (artist: null for 6 of
  // the 7 venues), save it to cache via saveCache(), and ONLY THEN crash
  // during renderList() — so the cache genuinely held that raw,
  // never-normalized shape. normalizeVenueShows() only runs inside a live
  // sweep's merge step, never when the cache is loaded straight off
  // localStorage, so every page load kept redisplaying that poisoned
  // snapshot: cards showing the literal text "null" (esc(null) stringifies
  // it), grouped into one giant multi-date card per venue (groupCatalogShows
  // keys on artist+venue, and every null-artist show from the same venue
  // collapses to the same '' key — confirmed by the math: The Chapel's
  // "77 dates" and Cornerstone's "19 dates" are both consistent with every
  // distinct real show at that venue merging into one card because they all
  // shared the same missing-artist key, not because 77 real shows actually
  // share one date range). Bumping the key means every browser's stale
  // cache is simply ignored on next load instead of trusted, forcing one
  // fresh sweep that runs through the now-fixed normalization — cheaper and
  // more certain than trying to detect/repair whatever's already sitting in
  // each visitor's localStorage.
  var LS_CACHE = 'cr_catalog_cache_v2';
  var CACHE_MAX_AGE_MS = 12 * 60 * 60 * 1000; // 12h — re-sweep automatically once stale
  var SWEEP_CONCURRENCY = 5; // parallel /api/tour-dates calls during a catalog sweep

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); }
    catch (e) { return []; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); }
    catch (e) { /* storage unavailable — deletes/watches just won't persist this session */ }
  }

  var hidden = loadJSON(LS_HIDDEN);
  // v16: Watching moved server-side (netlify/functions/watching.mjs) after
  // localStorage silently lost it for Susan — see version comment above.
  // Starts empty and is populated by loadWatching() on page init; every
  // mutation (addWatch, the delete handler below) now goes through the
  // /api/watching endpoint instead of a local save.
  var watching = [];
  var addedShows = loadJSON(LS_ADDED);

  // catalogShows = the result of the last full sweep of every distinct
  // artist in the collection + wishlist through /api/tour-dates. Loaded from
  // a localStorage cache first (instant) and refreshed in the background if
  // stale — see sweepCatalog() below.
  var catalogCache = (function () {
    try { return JSON.parse(localStorage.getItem(LS_CACHE) || 'null'); }
    catch (e) { return null; }
  })();
  var catalogShows = (catalogCache && Array.isArray(catalogCache.shows)) ? catalogCache.shows : [];

  var els = {
    artistInput: document.getElementById('cr-f-artist'),
    cityInput: document.getElementById('cr-f-city'),
    clearBtn: document.getElementById('cr-clear'),
    list: document.getElementById('cr-list'),
    watchList: document.getElementById('cr-watch-list'),
    searchBtn: document.getElementById('cr-search-btn'),
    live: document.getElementById('cr-live'),
    liveBody: document.getElementById('cr-live-body'),
    soonCount: document.getElementById('cr-soon-count'),
    soonStatus: document.getElementById('cr-soon-status'),
    soonRefresh: document.getElementById('cr-soon-refresh'),
    manualToggle: document.getElementById('cr-manual-toggle'),
    manualForm: document.getElementById('cr-manual-form'),
    manualCancel: document.getElementById('cr-manual-cancel'),
    manualError: document.getElementById('cr-manual-error'),
    manualArtist: document.getElementById('cr-m-artist'),
    manualDate: document.getElementById('cr-m-date'),
    manualVenue: document.getElementById('cr-m-venue'),
    manualCity: document.getElementById('cr-m-city'),
    manualUrl: document.getElementById('cr-m-url')
  };

  function fmtPrice(low, high) {
    return '$' + low.toLocaleString() + ' – $' + high.toLocaleString();
  }

  function fmtAgo(ts) {
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    var days = Math.round(hrs / 24);
    return days + (days === 1 ? ' day ago' : ' days ago');
  }

  // Coming Soon = real shows found by sweeping the collection + wishlist
  // (minus anything hidden) plus any shows manually pinned from an ad-hoc
  // live search (minus any the user's since removed). Every item carries
  // which kind it is (`_kind`) so delete can tell a re-computed catalog
  // match from a one-off pinned one apart.
  function comingSoonShows() {
    var fromCatalog = catalogShows.filter(function (s) { return hidden.indexOf(s.id) === -1; })
      .map(function (s) { return Object.assign({ _kind: 'catalog' }, s); });
    var fromAdded = addedShows.map(function (s) { return Object.assign({ _kind: 'added' }, s); });
    // De-dupe: a manually-added show that the catalog sweep also finds
    // shouldn't render twice.
    var seen = {};
    return fromCatalog.concat(fromAdded).filter(function (s) {
      if (seen[s.id]) return false;
      seen[s.id] = true;
      return true;
    }).sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  }

  // Groups same artist + same venue into one card with a date range instead
  // of a repeated row per date (e.g. a 7-night Buena Vista Social Club
  // residency was rendering as 7 near-identical cards). Only groups
  // catalog-sourced shows — manually pinned ("added") shows stay one-per-
  // card since they were each deliberately picked individually.
  function groupCatalogShows(items) {
    var order = [];
    var byKey = {};
    items.forEach(function (s) {
      var key = (s.artist || '').toLowerCase() + '|' + (s.venue || '').toLowerCase();
      if (!byKey[key]) { byKey[key] = []; order.push(key); }
      byKey[key].push(s);
    });
    return order.map(function (key) {
      var list = byKey[key].slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
      var seenDates = {};
      return list.filter(function (s) {
        if (seenDates[s.date]) return false;
        seenDates[s.date] = true;
        return true;
      });
    });
  }

  // Parses a YYYY-MM-DD string into a LOCAL Date built from its literal
  // Y/M/D components — NOT `new Date(iso)`, which parses as UTC midnight
  // and can land on the previous calendar day once converted to Pacific
  // time (exactly the kind of off-by-one this project's history warns
  // about — see CLAUDE.md's audio-preview matching saga for the general
  // "verify, don't assume" lesson this rhymes with).
  function parseISODateLocal(iso) {
    var p = (iso || '').split('-');
    if (p.length !== 3) return null;
    var y = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, d = parseInt(p[2], 10);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
    return new Date(y, m, d);
  }

  function fmtDateRange(items) {
    if (items.length === 1) return items[0].dateLabel || items[0].date || '';
    var first = items[0], last = items[items.length - 1];
    var fd = parseISODateLocal(first.date), ld = parseISODateLocal(last.date);
    if (!fd || !ld) return (first.dateLabel || first.date || '') + ' – ' + (last.dateLabel || last.date || '');
    var sameMonthYear = fd.getFullYear() === ld.getFullYear() && fd.getMonth() === ld.getMonth();
    var range = sameMonthYear
      ? fd.toLocaleDateString('en-US', { month: 'short' }) + ' ' + fd.getDate() + '–' + ld.getDate() + ', ' + fd.getFullYear()
      : fd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' – ' + ld.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    return range + ' · ' + items.length + ' dates';
  }

  function renderCard(items) {
    var s = items[0];
    var ids = items.map(function (it) { return it.id; });
    var cta = s.url ? '<a class="cr-live-cta" href="' + esc(s.url) + '" target="_blank" rel="noopener">Get tickets ↗</a>' : '';
    var already = isWatching(s.artist);
    var watchBtn = '<button type="button" class="cr-watch-inline-btn" data-watch-artist="' + esc(s.artist) + '" data-watch-city="' + esc(s.city || '') + '"' +
      (already ? ' disabled' : '') + '>' + (already ? 'Watching ✓' : '+ Watch') + '</button>';
    var lows = items.map(function (it) { return it.priceLow; }).filter(function (n) { return typeof n === 'number'; });
    var highs = items.map(function (it) { return it.priceHigh; }).filter(function (n) { return typeof n === 'number'; });
    var hasPrice = lows.length && highs.length;
    return '<div class="cr-item" data-id="' + esc(ids.join(',')) + '" data-kind="' + esc(s._kind) + '">' +
      '<div class="cr-who">' +
        '<div class="cr-artist">' + esc(s.artist) + '</div>' +
        '<div class="cr-venue">' + esc(s.venue || 'Venue TBA') + (s.city ? ' — ' + esc(s.city) : '') + '</div>' +
        '<div class="cr-tags"><span class="cr-source">via ' + esc(s.source || 'SeatGeek') + '</span></div>' +
        '<div class="cr-live-actions">' + cta + watchBtn + '</div>' +
      '</div>' +
      '<div class="cr-meta">' +
        '<div class="cr-date">' + esc(fmtDateRange(items)) + '</div>' +
        (hasPrice ? '<div class="cr-price">' + fmtPrice(Math.min.apply(null, lows), Math.max.apply(null, highs)) + '</div>' : '') +
      '</div>' +
      '<button type="button" class="cr-item-del" aria-label="Remove ' + esc(s.artist) + ' from the list" data-del="' + esc(ids.join(',')) + '" data-kind="' + esc(s._kind) + '">&times;</button>' +
    '</div>';
  }

  function renderList() {
    // Watched artists are excluded here — their date/price already shows
    // inline in the Watching panel (findWatchMatches still reads the full,
    // unfiltered comingSoonShows() below), so showing the same show again
    // as a Coming Soon card too would just be a duplicate.
    var shows = comingSoonShows().filter(function (s) { return !isShowWatched(s.artist); });

    if (!shows.length) {
      els.soonCount.textContent = '(0)';
      var allShows = comingSoonShows();
      els.list.innerHTML = allShows.length
        ? '<div class="cr-empty">Every upcoming show found is for an artist you\'re already watching — see the Watching panel above.</div>'
        : '<div class="cr-empty">No upcoming shows found for your collection & wishlist near Berkeley yet.</div>';
    } else {
      var catalogGroups = groupCatalogShows(shows.filter(function (s) { return s._kind === 'catalog'; }));
      var addedSingles = shows.filter(function (s) { return s._kind === 'added'; }).map(function (s) { return [s]; });
      var units = catalogGroups.concat(addedSingles).sort(function (a, b) {
        return (a[0].date || '').localeCompare(b[0].date || '');
      });
      // Count reflects what's actually on screen (cards, i.e. distinct
      // artist+venue bookings) rather than the raw per-date show total —
      // otherwise "(19)" next to 13 visible cards reads as a bug.
      els.soonCount.textContent = '(' + units.length + ')';
      els.list.innerHTML = units.map(renderCard).join('');
    }

    renderWatchList();
  }

  function findWatchMatches(name) {
    var q = (name || '').trim().toLowerCase();
    if (!q) return [];
    return comingSoonShows().filter(function (s) {
      var a = (s.artist || '').toLowerCase();
      return a.indexOf(q) !== -1 || q.indexOf(a) !== -1;
    }).sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  }

  // v16: null-guarded (was `artist.trim()` with no fallback) — this is the
  // exact call that threw "Cannot read properties of null (reading
  // 'trim')" once venue-shows.mjs entries with `artist: null` reached
  // renderCard(). The merge step now defaults artist to title before this
  // is ever called, but guarding here too matches isShowWatched() right
  // below, which already defended the same way.
  function isWatching(artist) {
    var q = (artist || '').trim().toLowerCase();
    return watching.some(function (w) { return w.artist.toLowerCase() === q; });
  }

  // Either/or rule: a show whose artist is already being watched doesn't
  // get its own Coming Soon card — the Watching panel's inline date/price
  // is the one place it shows up. Same loose substring match as
  // findWatchMatches() (not the stricter exact match isWatching() uses for
  // button state) so the hidden set and what the Watching panel displays
  // never disagree.
  function isShowWatched(artist) {
    var a = (artist || '').trim().toLowerCase();
    if (!a) return false;
    return watching.some(function (w) {
      var q = w.artist.trim().toLowerCase();
      return a.indexOf(q) !== -1 || q.indexOf(a) !== -1;
    });
  }

  function renderWatchList() {
    // v16: visible, persistent error text if a load/save/delete against
    // /api/watching failed — per this project's "no silent failures" rule,
    // this must never look identical to "you're not watching anything."
    var errorHtml = watchError ? '<p class="cr-watch-empty" style="color:#b3261e;">' + esc(watchError) + '</p>' : '';
    if (!watching.length) {
      els.watchList.innerHTML = errorHtml + '<p class="cr-watch-empty">Not watching any artists yet.</p>';
      return;
    }
    els.watchList.innerHTML = errorHtml + watching.map(function (w, i) {
      var matches = findWatchMatches(w.artist);
      // A watched artist either already has confirmed show(s) in Coming
      // Soon — in which case show the actual date(s) and price right here,
      // not just a badge that makes you go scroll and find it yourself —
      // or it doesn't, in which case the honest answer is "we don't know
      // yet," so offer a real live check instead of a static guess.
      var statusHtml;
      if (matches.length) {
        var lows = matches.map(function (m) { return m.priceLow; }).filter(function (n) { return typeof n === 'number'; });
        var highs = matches.map(function (m) { return m.priceHigh; }).filter(function (n) { return typeof n === 'number'; });
        var hasPrice = lows.length && highs.length;
        // Ticket link points at the earliest matched date (matches is
        // already sorted ascending), same convention as a grouped Coming
        // Soon card's own ticket link.
        var ticketUrl = matches.map(function (m) { return m.url; }).filter(Boolean)[0];
        statusHtml = '<div class="cr-watch-info">' +
          '<div class="cr-watch-date">' + esc(fmtDateRange(matches)) + '</div>' +
          (hasPrice ? '<div class="cr-watch-price">' + esc(fmtPrice(Math.min.apply(null, lows), Math.max.apply(null, highs))) + '</div>' : '') +
          (ticketUrl ? '<a class="cr-watch-cta" href="' + esc(ticketUrl) + '" target="_blank" rel="noopener">Get tickets ↗</a>' : '') +
        '</div>';
      } else {
        statusHtml = '<button type="button" class="cr-watch-check" data-watch-check="' + i + '">Check live &#8594;</button>';
      }
      // Artist name + delete button share a top row (delete always stays
      // put, never pushed onto its own orphaned line); date/price/ticket
      // link flow on their own full-width row below, so a long date range
      // (e.g. "Feb 6–20, 2027 · 7 dates") has room to wrap without
      // widowing the × — the bug a 7-night Buena Vista Social Club
      // residency exposed.
      return '<div class="cr-watch-row">' +
        '<div class="cr-watch-top">' +
          '<div class="cr-watch-who">' +
            '<div class="cr-watch-artist">' + esc(w.artist) + '</div>' +
            (w.city ? '<div class="cr-watch-city">' + esc(w.city) + '</div>' : '') +
          '</div>' +
          '<button type="button" class="cr-watch-del" aria-label="Stop watching ' + esc(w.artist) + '" data-watch-del="' + esc(w.id || '') + '">&times;</button>' +
        '</div>' +
        statusHtml +
      '</div>';
    }).join('');
  }

  els.clearBtn.addEventListener('click', function () {
    els.artistInput.value = '';
    els.cityInput.value = '';
    els.live.hidden = true;
    els.liveBody.innerHTML = '';
    els.clearBtn.hidden = true;
    els.artistInput.focus();
  });

  els.list.addEventListener('click', function (e) {
    var watchBtn = e.target.closest('[data-watch-artist]');
    if (watchBtn) {
      // addWatch() re-renders the whole list itself — the either/or rule
      // means this card (and any sibling dates in its group) may need to
      // disappear from Coming Soon now that its artist is watched, so a
      // simple button-state toggle here isn't enough.
      addWatch(watchBtn.getAttribute('data-watch-artist'), watchBtn.getAttribute('data-watch-city'));
      return;
    }
    var btn = e.target.closest('[data-del]');
    if (!btn) return;
    // A grouped card (e.g. a multi-night residency) carries every
    // underlying show id comma-joined — removing the card removes all of
    // them, not just the first.
    var ids = btn.getAttribute('data-del').split(',');
    var kind = btn.getAttribute('data-kind');
    if (kind === 'added') {
      addedShows = addedShows.filter(function (s) { return ids.indexOf(s.id) === -1; });
      saveJSON(LS_ADDED, addedShows);
    } else {
      ids.forEach(function (id) { if (hidden.indexOf(id) === -1) hidden.push(id); });
      saveJSON(LS_HIDDEN, hidden);
    }
    renderList();
  });

  // v16: Watching is server-backed (netlify/functions/watching.mjs) — see
  // version comment above for why. watchError surfaces a load/save/delete
  // failure directly in the Watching panel itself (renderWatchList() below
  // prepends it when set) rather than failing silently, per this project's
  // "no silent failures" rule; a network hiccup here should be visible,
  // not indistinguishable from "nothing is watched."
  var watchError = null;

  function randomId(prefix) {
    var hex = '';
    var bytes = new Uint8Array(8);
    crypto.getRandomValues(bytes);
    for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
    return prefix + '_' + hex;
  }

  function loadWatching() {
    return fetch('/api/watching')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (list) {
        watching = Array.isArray(list) ? list.filter(function (w) { return w && w.artist; }) : [];
        watchError = null;
      })
      .catch(function (err) {
        watching = [];
        watchError = 'Could not load Watching: ' + err.message;
      });
  }

  // Shared by the Watching panel's own form AND the "+ Watch <artist>"
  // button on live search results. Async now — POSTs to /api/watching
  // before updating local state, so a failed write never looks like it
  // succeeded.
  function addWatch(artist, city) {
    artist = (artist || '').trim();
    if (!artist) return Promise.resolve(false);
    city = (city || '').trim();
    if (isWatching(artist)) return Promise.resolve(false);
    var item = { id: randomId('watch'), artist: artist, city: city };
    return fetch('/api/watching', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(item)
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      watching.push(item);
      watchError = null;
      // Full re-render (not just the Watching panel) — watching an artist can
      // remove Coming Soon card(s) it already had, under the either/or rule.
      renderList();
      return true;
    }).catch(function (err) {
      watchError = 'Could not save "' + artist + '" to Watching: ' + err.message;
      renderWatchList();
      return false;
    });
  }

  els.watchList.addEventListener('click', function (e) {
    var delBtn = e.target.closest('[data-watch-del]');
    if (delBtn) {
      var id = delBtn.getAttribute('data-watch-del');
      var w = watching.filter(function (x) { return x.id === id; })[0];
      fetch('/api/watching/' + encodeURIComponent(id), { method: 'DELETE' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          watching = watching.filter(function (x) { return x.id !== id; });
          watchError = null;
          // Full re-render, not just the Watching panel — un-watching an
          // artist can bring its card(s) back into Coming Soon under the
          // either/or rule.
          renderList();
        })
        .catch(function (err) {
          watchError = 'Could not remove "' + (w ? w.artist : id) + '": ' + err.message;
          renderWatchList();
        });
      return;
    }
    var checkBtn = e.target.closest('[data-watch-check]');
    if (checkBtn) {
      var idx = parseInt(checkBtn.getAttribute('data-watch-check'), 10);
      var wc = watching[idx];
      if (!wc) return;
      els.artistInput.value = wc.artist;
      els.cityInput.value = wc.city || '';
      runLiveSearch();
      els.live.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
  });

  // --- Live search: real query against /api/tour-dates (SeatGeek-backed). ---
  // Kept in its own section, never merged into the SHOWS sample list above —
  // this codebase's established discipline is to never let real and sample
  // data look the same (see CLAUDE.md's "Preview — sample data" history).

  function showLiveStatus(msg, isError) {
    els.liveBody.innerHTML = '<div class="cr-live-status' + (isError ? ' is-error' : '') + '">' + esc(msg) + '</div>';
  }

  // Full show objects from the last render, keyed by id, so the delegated
  // click handler below can look one up when "Add to Coming Soon" is clicked
  // without re-parsing anything out of the DOM.
  var lastLiveShowsById = {};

  function watchRowHtml(artist, city) {
    var already = isWatching(artist);
    return '<div class="cr-live-watch-row">' +
      '<button type="button" class="cr-watch-inline-btn" data-watch-artist="' + esc(artist) + '" data-watch-city="' + esc(city || '') + '"' +
      (already ? ' disabled' : '') + '>' + (already ? 'Watching ✓' : '+ Watch ' + esc(artist)) + '</button>' +
    '</div>';
  }

  function renderLiveResults(shows, meta, queriedArtist) {
    var cityQ = els.cityInput.value.trim().toLowerCase();
    var filtered = (shows || []).filter(function (s) {
      if (!cityQ) return true;
      return (s.city || '').toLowerCase().indexOf(cityQ) !== -1 ||
        (s.venue || '').toLowerCase().indexOf(cityQ) !== -1;
    });

    // Only surface the "matched performer" line when the match was a fuzzy
    // fallback — an exact match doesn't need the caveat.
    var matchedLine = (meta.matched_performer && meta.match_tier === 'fuzzy')
      ? '<div class="cr-live-matched">Closest match: ' + esc(meta.matched_performer) + ' — double-check before trusting</div>'
      : '';

    if (!meta.matched_performer) {
      els.liveBody.innerHTML = matchedLine +
        '<div class="cr-live-status">No SeatGeek performer found matching “' + esc(queriedArtist) +
        '.” Try the exact act name (as billed, not a nickname).</div>';
      return;
    }

    var watchRow = watchRowHtml(meta.matched_performer, els.cityInput.value.trim());

    if (!filtered.length) {
      els.liveBody.innerHTML = matchedLine + watchRow +
        '<div class="cr-live-status">No upcoming ' + esc(meta.matched_performer) + ' shows found within ' +
        esc(meta.range || 'range') + ' of Berkeley' +
        (cityQ ? ' matching “' + esc(els.cityInput.value.trim()) + '”' : '') + '.</div>';
      return;
    }

    lastLiveShowsById = {};
    filtered.forEach(function (s) { lastLiveShowsById[s.id] = s; });

    els.liveBody.innerHTML = matchedLine + watchRow + filtered.map(function (s) {
      var hasPrice = typeof s.priceLow === 'number' && typeof s.priceHigh === 'number';
      var added = addedShows.some(function (a) { return a.id === s.id; });
      return '<div class="cr-live-item">' +
        '<div class="cr-who">' +
          '<div class="cr-artist">' + esc(s.artist || meta.matched_performer) + '</div>' +
          '<div class="cr-venue">' + esc(s.venue || 'Venue TBA') + (s.city ? ' — ' + esc(s.city) : '') + '</div>' +
          '<div class="cr-tags"><span class="cr-live-tag">Live</span><span class="cr-source">via ' + esc(s.source || 'SeatGeek') + '</span></div>' +
          '<div class="cr-live-actions">' +
            (s.url ? '<a class="cr-live-cta" href="' + esc(s.url) + '" target="_blank" rel="noopener">Get tickets ↗</a>' : '') +
            '<button type="button" class="cr-live-add-btn" data-add-show="' + esc(s.id) + '"' + (added ? ' disabled' : '') + '>' +
              (added ? 'Added ✓' : '+ Add to Coming Soon') +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div class="cr-meta">' +
          '<div class="cr-date">' + esc(s.dateLabel || s.date || 'Date TBA') + '</div>' +
          (hasPrice ? '<div class="cr-price">' + fmtPrice(s.priceLow, s.priceHigh) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  els.liveBody.addEventListener('click', function (e) {
    var watchBtn = e.target.closest('[data-watch-artist]');
    if (watchBtn) {
      // Live Results has its own DOM, untouched by renderList() — flip this
      // button's own state manually. addWatch() itself re-renders Coming
      // Soon + the Watching panel (either/or rule may hide card(s) this
      // artist already had showing in Coming Soon).
      addWatch(watchBtn.getAttribute('data-watch-artist'), watchBtn.getAttribute('data-watch-city'));
      watchBtn.textContent = 'Watching ✓';
      watchBtn.disabled = true;
      return;
    }
    var addBtn = e.target.closest('[data-add-show]');
    if (addBtn) {
      var id = addBtn.getAttribute('data-add-show');
      var show = lastLiveShowsById[id];
      if (show && !addedShows.some(function (a) { return a.id === id; })) {
        addedShows.push(show);
        saveJSON(LS_ADDED, addedShows);
        renderList();
        addBtn.textContent = 'Added ✓';
        addBtn.disabled = true;
      }
      return;
    }
  });

  var liveSearchInFlight = false;
  // v16.2: this powers BOTH the manual Search panel AND the Watching
  // panel's "Check live →" button (watchRowHtml -> runLiveSearch). It only
  // ever queried /api/tour-dates (SeatGeek) — which is exactly why "Check
  // live" for Black Uhuru / Easy Star All-Stars / Burning Spear always came
  // back empty even after the venue scraper shipped: those are precisely
  // the artists SeatGeek has zero events for, that's the whole reason
  // /api/venue-shows exists. Now queries both in parallel (same pattern the
  // Coming Soon sweep already uses) and filters the venue-shows results
  // client-side to whatever substring-matches the searched artist name,
  // same loose match findWatchMatches()/isShowWatched() already use
  // elsewhere in this file.
  function runLiveSearch() {
    if (liveSearchInFlight) return;
    var artist = els.artistInput.value.trim();
    els.live.hidden = false;
    els.clearBtn.hidden = false;
    if (!artist) {
      showLiveStatus('Enter an artist name above, then search.', true);
      els.artistInput.focus();
      return;
    }
    liveSearchInFlight = true;
    els.searchBtn.disabled = true;
    els.searchBtn.textContent = 'Searching…';
    showLiveStatus('Searching SeatGeek and watched venues for “' + artist + '” near Berkeley…', false);

    var artistQ = artist.toLowerCase();

    Promise.all([
      fetch('/api/tour-dates?artist=' + encodeURIComponent(artist))
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
        })
        .catch(function (err) { return { ok: false, status: 0, data: { error: err.message } }; }),
      fetchVenueShows()
    ]).then(function (results) {
      var tourDatesResult = results[0];
      var venueShowsAll = results[1];
      // Same loose substring match as findWatchMatches() — a venue show's
      // artist (already defaulted to title by normalizeVenueShows() when
      // the venue's own parser never extracted a distinct artist) either
      // contains the query or the query contains it.
      var venueMatches = normalizeVenueShows(venueShowsAll).filter(function (s) {
        var a = (s.artist || '').toLowerCase();
        return !!a && (a.indexOf(artistQ) !== -1 || artistQ.indexOf(a) !== -1);
      });

      var seatgeekOk = tourDatesResult.ok;
      var seatgeekShows = (seatgeekOk && Array.isArray(tourDatesResult.data.shows)) ? tourDatesResult.data.shows : [];
      var meta = (seatgeekOk && tourDatesResult.data.meta) ? tourDatesResult.data.meta : {};

      if (!seatgeekOk && !venueMatches.length) {
        // SeatGeek itself errored (not just "no performer found") and the
        // venue scrape found nothing either — this is the one case worth
        // surfacing as a real failure rather than "no results."
        showLiveStatus((tourDatesResult.data && tourDatesResult.data.error) ? tourDatesResult.data.error : ('Search failed (HTTP ' + tourDatesResult.status + ').'), true);
        return;
      }

      if (!meta.matched_performer && !venueMatches.length) {
        showLiveStatus('No SeatGeek performer or watched-venue show found matching “' + artist + '.” Try the exact act name (as billed, not a nickname).', true);
        return;
      }

      var combined = seatgeekShows.concat(venueMatches);
      combined = dedupeById(combined);
      // If SeatGeek didn't resolve a performer but a venue show matched,
      // still render with the typed name as the display/watch target —
      // "no SeatGeek performer" shouldn't hide a real venue-sourced match.
      var effectiveMeta = meta.matched_performer ? meta : Object.assign({}, meta, { matched_performer: artist });
      renderLiveResults(combined, effectiveMeta, artist);
    })
      .catch(function (err) {
        showLiveStatus('Could not reach the search endpoint: ' + err.message, true);
      })
      .finally(function () {
        liveSearchInFlight = false;
        els.searchBtn.disabled = false;
        els.searchBtn.textContent = 'Search live listings';
      });
  }

  els.searchBtn.addEventListener('click', runLiveSearch);
  els.artistInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') runLiveSearch(); });
  els.cityInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') runLiveSearch(); });

  // --- Catalog sweep: real Coming Soon data, sourced from the collection
  // and wishlist rather than a static mock list. Every distinct artist name
  // across both gets a real /api/tour-dates lookup (same endpoint the
  // Search panel uses), run with limited concurrency so a ~100-artist
  // catalog doesn't fire 100 simultaneous requests. Results are cached in
  // localStorage with a timestamp so a normal page visit is instant; the
  // sweep itself only re-runs automatically once the cache goes stale
  // (12h) or the user clicks Refresh. An artist with no confirmed match is
  // silently omitted — same graceful-degradation rule as audio-preview's
  // Deezer/YouTube tiers (see CLAUDE.md): never treat "no match" as an
  // error, only "the request itself failed" is.

  function saveCache(shows, artistCount) {
    catalogCache = { at: Date.now(), shows: shows, artistCount: artistCount };
    try { localStorage.setItem(LS_CACHE, JSON.stringify(catalogCache)); } catch (e) {}
  }

  // Runs `iterator` over `items` with at most `limit` in flight at once.
  // Never rejects — a failing item resolves to `fallback` instead, so one
  // bad artist lookup can't derail the whole sweep.
  function mapLimit(items, limit, iterator, onItemDone) {
    return new Promise(function (resolve) {
      if (!items.length) { resolve([]); return; }
      var results = new Array(items.length);
      var nextIndex = 0;
      var completed = 0;
      function runNext() {
        if (nextIndex >= items.length) return;
        var i = nextIndex++;
        Promise.resolve(iterator(items[i], i))
          .then(function (r) { results[i] = r; })
          .catch(function () { results[i] = null; })
          .then(function () {
            completed++;
            if (onItemDone) onItemDone(completed, items.length);
            if (completed === items.length) resolve(results);
            else runNext();
          });
      }
      for (var k = 0; k < Math.min(limit, items.length); k++) runNext();
    });
  }

  function fetchDistinctArtists() {
    return Promise.all([
      fetch('/api/records').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
      fetch('/api/wishlist').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })
    ]).then(function (results) {
      var records = Array.isArray(results[0]) ? results[0] : [];
      var wishlist = Array.isArray(results[1]) ? results[1] : [];
      var seen = {};
      var names = [];
      records.concat(wishlist).forEach(function (item) {
        var name = (item && item.artist ? String(item.artist) : '').trim();
        if (!name) return;
        var key = name.toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        names.push(name);
      });
      return names;
    });
  }

  var sweepInFlight = false;
  // v16 fix: most venue-shows.mjs parsers only ever have a `title` (no
  // distinct `artist`), so those entries arrive with `artist: null`.
  // Default to the title here, wherever venue shows get merged in, so
  // every downstream consumer (renderCard, isWatching, findWatchMatches,
  // grouping) always sees a real string — this is what "Cannot read
  // properties of null (reading 'trim')" traced back to (see v16 note in
  // the version comment above).
  function normalizeVenueShows(venueShows) {
    return venueShows.map(function (s) {
      return s && !s.artist ? Object.assign({}, s, { artist: s.title || '' }) : s;
    });
  }

  function fetchVenueShows() {
    return fetch('/api/venue-shows')
      .then(function (res) { return res.ok ? res.json() : { shows: [] }; })
      .then(function (data) { return Array.isArray(data.shows) ? data.shows : []; })
      .catch(function () { return []; });
  }

  function dedupeById(list) {
    var seenIds = {};
    return list.filter(function (s) {
      if (!s || !s.id || seenIds[s.id]) return false;
      seenIds[s.id] = true;
      return true;
    });
  }

  function sweepCatalog() {
    if (sweepInFlight) return;
    sweepInFlight = true;
    els.soonRefresh.disabled = true;
    els.soonStatus.textContent = 'Checking your collection & wishlist for artists…';

    // v16: venue-shows.mjs's 7-venue scrape (added 2026-08-04) is a fixed
    // list of Bay Area venues, not an artist lookup — it has nothing to do
    // with what's in the catalog/wishlist. Kick it off immediately, in
    // parallel with the artist lookup below, so Refresh always re-scrapes
    // those venues too (previously this fetch lived inside the
    // artists.length branch below and was skipped entirely on the
    // zero-artists early return — a real gap, not just a hypothetical one,
    // since venue-shows owes the catalog nothing).
    var venueShowsPromise = fetchVenueShows();

    fetchDistinctArtists().then(function (artists) {
      if (!artists.length) {
        return venueShowsPromise.then(function (venueShows) {
          catalogShows = dedupeById(normalizeVenueShows(venueShows));
          els.soonStatus.textContent = catalogShows.length
            ? 'No artists found in your collection or wishlist — showing venue listings only · just now'
            : 'No artists found in your collection or wishlist yet.';
          saveCache(catalogShows, 0);
          renderList();
        });
      }

      els.soonStatus.textContent = 'Checking 0 of ' + artists.length + ' artists for tour dates…';

      // Two sources run in parallel: the existing per-artist SeatGeek sweep,
      // plus the venue scrape kicked off above. venue-shows.mjs returns
      // shows in the exact same shape tour-dates.mjs does, so no reshaping
      // is needed here — they just concat into the same list before
      // de-duping.
      return Promise.all([
        mapLimit(artists, SWEEP_CONCURRENCY, function (artist) {
          return fetch('/api/tour-dates?artist=' + encodeURIComponent(artist))
            .then(function (res) { return res.ok ? res.json() : { shows: [] }; })
            .then(function (data) { return Array.isArray(data.shows) ? data.shows : []; })
            .catch(function () { return []; });
        }, function (completed, total) {
          els.soonStatus.textContent = 'Checking ' + completed + ' of ' + total + ' artists for tour dates…';
        }),
        venueShowsPromise
      ]).then(function (results) {
        var perArtistShows = results[0];
        var venueShows = results[1];
        var all = normalizeVenueShows(venueShows);
        perArtistShows.forEach(function (list) { if (list) all = all.concat(list); });
        // De-dupe by id in case the same show surfaced under two different
        // artist queries (e.g. a co-headline bill in both the catalog and
        // the wishlist).
        catalogShows = dedupeById(all);
        saveCache(catalogShows, artists.length);
        els.soonStatus.textContent = 'Checked ' + artists.length + ' artists · just now';
        renderList();
      });
    }).catch(function (err) {
      els.soonStatus.textContent = 'Could not check your collection & wishlist: ' + err.message;
    }).then(function () {
      sweepInFlight = false;
      els.soonRefresh.disabled = false;
    });
  }

  els.soonRefresh.addEventListener('click', sweepCatalog);

  // --- Manual add: for a real show that exists but SeatGeek's own
  // inventory doesn't carry (e.g. an indie venue that sells its own
  // tickets or through a platform SeatGeek doesn't index — confirmed real
  // for Black Uhuru at The Freight & Salvage, Berkeley, 2026-08-04). Pins
  // straight into the same addedShows/localStorage mechanism a Live
  // Results "+ Add to Coming Soon" click already uses, just without
  // requiring a SeatGeek hit first. Tagged "Manual entry" (never
  // "SeatGeek") so the source is always honest about where the data came
  // from — same discipline as the Live/Sample tag distinction elsewhere on
  // this page. Requires Artist + Date + a real ticket URL; venue/city are
  // optional since not every show has a fixed venue confirmed yet.
  function resetManualForm() {
    els.manualForm.reset();
    els.manualError.hidden = true;
  }

  els.manualToggle.addEventListener('click', function () {
    els.manualForm.hidden = false;
    els.manualToggle.hidden = true;
    els.manualArtist.focus();
  });

  els.manualCancel.addEventListener('click', function () {
    resetManualForm();
    els.manualForm.hidden = true;
    els.manualToggle.hidden = false;
  });

  els.manualForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var artist = els.manualArtist.value.trim();
    var date = els.manualDate.value; // native <input type=date> gives YYYY-MM-DD directly
    var venue = els.manualVenue.value.trim();
    var city = els.manualCity.value.trim();
    var url = els.manualUrl.value.trim();

    if (!artist || !date || !url) {
      els.manualError.textContent = 'Artist, date, and a ticket link are all required.';
      els.manualError.hidden = false;
      return;
    }
    try {
      var parsed = new URL(url);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') throw new Error('bad protocol');
    } catch (err) {
      els.manualError.textContent = 'Ticket link needs to be a full URL, e.g. https://…';
      els.manualError.hidden = false;
      return;
    }

    var d = parseISODateLocal(date);
    var dateLabel = d ? d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : date;

    addedShows.push({
      id: 'manual-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
      artist: artist,
      venue: venue || null,
      city: city || null,
      date: date,
      dateLabel: dateLabel,
      source: 'Manual entry',
      priceLow: null,
      priceHigh: null,
      url: url
    });
    saveJSON(LS_ADDED, addedShows);
    renderList();

    resetManualForm();
    els.manualForm.hidden = true;
    els.manualToggle.hidden = false;
  });

  // First render: show whatever's cached (instant) — even if empty — then
  // decide whether a fresh sweep is needed.
  renderList();
  if (catalogCache && typeof catalogCache.at === 'number') {
    var age = Date.now() - catalogCache.at;
    els.soonStatus.textContent = 'Checked ' + (catalogCache.artistCount || 0) + ' artists · ' + fmtAgo(catalogCache.at);
    if (age > CACHE_MAX_AGE_MS) sweepCatalog();
  } else {
    sweepCatalog();
  }

  // v16: Watching now loads from /api/watching (server-side, see version
  // comment above) instead of localStorage, so it's fetched async here and
  // re-rendered once it resolves — including the one-time seed of 3 artists
  // Susan named directly (Easy Star All-Stars, Black Uhuru, Burning Spear),
  // which watching.mjs's GET handler adds server-side on first-ever call.
  loadWatching().then(renderList);
})();
</script>
