<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preload" href="/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>/* Self-hosted fonts (latin) — was Google Fonts; files from the official Fontsource/IBM npm releases, 2026-07-26. Extended to this page 2026-07-27 to match index.html. */
@font-face{font-family:"Fraunces";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/fraunces-latin-full-normal.woff2) format("woff2-variations")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2")}
</style>
  <link rel="stylesheet" href="/style.css?v=27" />
  <style>
    /* Wishlist — version: 16. Mobile touch-target fix (2026-07-20): .wl-play
       (the inline preview play/pause button on each row) was 36x36px,
       under the 44px minimum PROJECT.md's Working Agreement specifies for
       tap targets — bumped width/height/min-width to 44px (already
       display:inline-flex + centered, so no alignment fix needed, unlike
       the .chip/.vbtn fix in this same pass — see style.css v27). The
       circular shape and icon stay the same size visually relative to the
       larger tap area; only the invisible hit target grew.
       version: 15. Phase 4 extension: audio preview clips, per
       Susan's request (roadmap.html previously listed this as "a possible
       follow-up, not yet built"). Reuses the same /api/audio/preview
       endpoint and payload shape the catalog detail modal already uses
       (see app.js buildAudioBlock/playPreview, netlify/functions/
       audio-preview.mjs) — Deezer first, YouTube last-resort fallback, same
       graceful-degradation messages. Each row gets a compact play/pause
       button (.wl-play); tapping it expands an inline panel below that row
       (.wl-audio-panel) reusing the SAME .detail__audio-* classes already
       defined in style.css, so no new shared CSS was needed for the player
       itself — only the row-level play button and panel container are
       page-scoped here. Only one preview plays at a time across the whole
       page: starting a new one stops whatever was already playing, and
       changing pages / adding / deleting also stops the active preview
       first (since render() fully replaces #wl-list's innerHTML, and a
       detached <audio>/<iframe> element does NOT auto-pause on removal —
       confirmed this is a real gotcha, not hypothetical, matching the same
       reasoning as detail__audio's "paused when the modal closes" comment
       in app.js).
       v14. Paginated at 20 items/page (Susan's ask,
       2026-07-12 — the list had grown to 70+ items after a Spotify playlist
       review added 16 new records). Prev/Next controls + "Page X of Y",
       matching the app's existing minimal typographic style (mono, uppercase,
       muted). Sort stays alphabetical by artist; pagination slices AFTER
       sorting so page boundaries stay stable. currentPage resets to 1 on
       load and clamps down automatically if a delete empties out the last
       page. Adds keep the current page (an added item can land on any page
       once re-sorted; no auto-jump).
       v13. Manual add form simplified to just artist + title (Discogs URL
       and Notes fields removed per Susan's request, 2026-07-12) — and now
       calls /api/discogs/lookup itself at add-time to fill in cover_url +
       discogs_release_id automatically. Previously the manual-add path never
       looked anything up, so every manually-added item had no cover art
       unless Susan happened to paste a Discogs URL herself (confirmed live:
       1/56 items had no cover_url — Anita Baker's "Rapture", added with no
       URL — backfilled separately). Items added by the automated weekly sync
       (Spotify/Amazon cart) already got covers this way; this brings the
       manual form to parity. Lookup failures degrade gracefully — the item
       still gets added with no cover_url, same as before, never blocks the
       add. (edit-secret gate removed per Susan, 2026-07-11 — mobile-
       impractical) */
    .wl-wrap { max-width: 860px; margin: 0 auto; padding: 0 32px 90px; }
    .wl-intro { font-family: var(--sans); font-size: 15px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 22px; }
    .wl-item { border: 1px solid var(--rule); background: var(--surface); border-radius: 3px; padding: 6px 12px 6px 6px; margin-bottom: 5px; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: nowrap; }
    .wl-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 2px; flex: 0 0 44px; background: var(--bg-soft); display: block; }
    .wl-who { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wl-who { min-width: 0; }
    .wl-artist { font-weight: 600; font-size: 15px; color: var(--ink); }
    .wl-title { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink-soft); }
    .wl-notes { font-family: var(--sans); font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
    .wl-nums { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); letter-spacing: 0.04em; white-space: nowrap; flex: 0 0 auto; margin-left: auto; }
    .wl-nums a { border-bottom: 1px solid var(--rule); }
    .wl-del { background: transparent; border: 0; color: var(--ink-faint); font-size: 18px; cursor: pointer; padding: 4px 8px; }
    .wl-del:hover { color: var(--accent); }
    .wl-form { margin-top: 34px; border-top: 1px solid var(--rule); padding-top: 22px; }
    .wl-form h3 { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 14px; }
    .wl-form .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .wl-form input { font-family: var(--mono); font-size: 16px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 2px; background: var(--bg); color: var(--ink); flex: 1 1 180px; min-height: 44px; }
    .wl-pager { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 18px 0 0; }
    .wl-pager button { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: transparent; border: 1px solid var(--rule); color: var(--ink-soft); padding: 10px 16px; min-height: 44px; min-width: 44px; border-radius: 2px; cursor: pointer; }
    .wl-pager button:hover:not(:disabled) { border-color: var(--ink-faint); color: var(--ink); }
    .wl-pager button:disabled { opacity: 0.35; cursor: default; }
    .wl-pager__status { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; }
    .wl-play { font-family: var(--mono); font-size: 12px; background: transparent; border: 1px solid var(--rule); color: var(--ink-soft); width: 44px; height: 44px; min-width: 44px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; -webkit-tap-highlight-color: transparent; transition: border-color 100ms, color 100ms; }
    .wl-play:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
    .wl-play:disabled { opacity: 0.6; cursor: progress; }
    .wl-play.is-playing { border-color: var(--accent); color: var(--accent); }
    .wl-audio-panel { margin: 0 0 5px; padding: 10px 12px; border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 3px 3px; background: var(--surface); }
    .wl-audio-panel[hidden] { display: none; }
    @media (max-width: 720px) { .wl-wrap { padding: 0 18px 64px; } }
  </style>
</head>
<body>

<header class="masthead">
  <a class="brand" href="/" aria-label="The Vinyl Scout: home">
    <span class="brand__mark" aria-hidden="true">⦿</span>
    <h1>The Vinyl Scout</h1>
  </a>
  <nav class="masthead__nav" aria-label="Primary">
      <a href="/seed.html">Add</a>
      <a href="/audit.html">Audit</a>
      <a href="/wishlist.html">Wishlist</a>
      <a href="/roadmap.html">Roadmap</a>
      <a href="/guide.html">Guide</a>
      <a href="/about.html">About</a>
      <a href="/start.html">Build Your Own</a>
    </nav>
</header>

<h2 class="collection-title">Wishlist</h2>

<div id="error-banner" class="error-banner" hidden role="alert"></div>

<main class="wl-wrap">
  <p class="wl-intro">Prices update every Monday. </p>
  <div id="wl-list"><div class="empty">Loading…</div></div>
  <div id="wl-pager" class="wl-pager"></div>

  <section class="wl-form" aria-label="Add to wishlist">
    <h3>Add a record</h3>
    <div class="row">
      <input id="f-artist" placeholder="Artist (required)" autocomplete="off" />
      <input id="f-title" placeholder="Title (required)" autocomplete="off" />
    </div>
    <button id="f-add" class="btn" type="button">Add to wishlist</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function esc(s) { if (s == null) return ''; var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
  function showError(msg) { var el = $('error-banner'); el.textContent = msg; el.hidden = false; }
  function clearError() { var el = $('error-banner'); el.textContent = ''; el.hidden = true; }
  function fmt(n) { return (n == null || isNaN(n)) ? null : '€' + Number(n).toFixed(2); }

  var items = [];
  var PAGE_SIZE = 20;
  var currentPage = 1;
  var activePreviewId = null;

  async function load() {
    try {
      var res = await fetch('/api/wishlist?bust=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      items = await res.json();
      clearError();
      currentPage = 1;
      render();
    } catch (err) {
      showError('Failed to load wishlist: ' + err.message);
      $('wl-list').innerHTML = '<div class="empty">Failed to load.</div>';
    }
  }

  function renderPager(totalPages) {
    var pager = $('wl-pager');
    if (totalPages <= 1) { pager.innerHTML = ''; return; }
    pager.innerHTML = ''
      + '<button type="button" id="wl-prev"' + (currentPage <= 1 ? ' disabled' : '') + '>‹ Prev</button>'
      + '<span class="wl-pager__status">Page ' + currentPage + ' of ' + totalPages + '</span>'
      + '<button type="button" id="wl-next"' + (currentPage >= totalPages ? ' disabled' : '') + '>Next ›</button>';
  }

  // Removing a playing <audio>/<iframe> from the DOM does NOT auto-pause it
  // (a real gotcha, confirmed — detached media elements keep playing) —
  // render() fully replaces #wl-list's innerHTML on every load/add/delete/
  // page-change, so any active preview must be stopped first, every time.
  function stopPreview(id) {
    var panel = $('wl-audio-' + id);
    if (panel) {
      var player = panel.querySelector('audio, iframe');
      if (player) {
        if (player.tagName === 'IFRAME') { try { player.src = ''; } catch (e) {} }
        else { try { player.pause(); } catch (e) {} }
      }
      panel.hidden = true;
      panel.innerHTML = '';
    }
    var btn = document.querySelector('.wl-play[data-id="' + id + '"]');
    if (btn) { btn.classList.remove('is-playing'); btn.disabled = false; btn.textContent = '▶'; btn.setAttribute('aria-label', 'Play preview'); }
    if (activePreviewId === id) activePreviewId = null;
  }

  async function togglePreview(id, artist, title, btn) {
    if (activePreviewId === id) { stopPreview(id); return; }
    if (activePreviewId) stopPreview(activePreviewId);

    var panel = $('wl-audio-' + id);
    activePreviewId = id;
    btn.disabled = true;
    btn.textContent = '…';
    if (panel) { panel.hidden = false; panel.innerHTML = '<p class="detail__audio-empty">Looking up…</p>'; }

    try {
      var qs = '?artist=' + encodeURIComponent(artist) + '&title=' + encodeURIComponent(title);
      var res = await fetch('/api/audio/preview' + qs);
      var payload;
      try { payload = await res.json(); } catch (_) { payload = { error: 'HTTP ' + res.status }; }

      if (!res.ok) {
        var msg = (payload && payload.error) || ('HTTP ' + res.status);
        if (panel) panel.innerHTML = '<p class="detail__audio-error">' + esc(msg) + '</p>';
        activePreviewId = null;
        btn.disabled = false; btn.textContent = '▶';
        return;
      }

      var providerNames = { deezer: 'Deezer', youtube: 'YouTube' };
      var providerLabel = providerNames[payload.provider] || null;

      if (!payload.available) {
        var note = payload.reason === 'not_configured'
          ? 'Audio preview isn’t set up yet.'
          : payload.reason === 'no_preview'
            ? 'No preview clip available for this track.'
            : payload.reason === 'no_match_pending_youtube'
              ? 'Not found on Deezer: a YouTube fallback is planned but not turned on yet.'
              : 'No matching track found: checked Deezer and YouTube.';
        var t2 = payload.track || {};
        var link = (payload.reason === 'no_preview' && t2.external_url && providerLabel)
          ? '<a class="detail__audio-spotify-link" href="' + esc(t2.external_url) + '" target="_blank" rel="noopener">Listen on ' + esc(providerLabel) + ' ↗</a>'
          : '';
        var label2 = [t2.artists, t2.name].filter(Boolean).join(': ');
        if (panel) {
          panel.innerHTML = ''
            + (label2 ? '<p class="detail__audio-track">' + esc(label2) + '</p>' : '')
            + '<p class="detail__audio-empty">' + esc(note) + '</p>'
            + link;
        }
        activePreviewId = null;
        btn.disabled = false; btn.textContent = '▶';
        return;
      }

      var t = payload.track || {};
      var label = [t.artists, t.name].filter(Boolean).join(': ');
      var playerHtml = (payload.provider === 'youtube' && t.embed_url)
        ? '<iframe class="detail__audio-player detail__audio-youtube" '
          + 'src="' + esc(t.embed_url) + '" '
          + 'title="YouTube preview" frameborder="0" '
          + 'allow="autoplay; encrypted-media" allowfullscreen></iframe>'
        : '<audio class="detail__audio-player" controls autoplay preload="auto" src="' + esc(t.preview_url) + '"></audio>';
      if (panel) {
        panel.innerHTML = ''
          + (label ? '<p class="detail__audio-track">' + esc(label) + '</p>' : '')
          + playerHtml
          + (providerLabel ? '<p class="detail__audio-provider">via ' + esc(providerLabel) + '</p>' : '');
      }
      btn.disabled = false;
      btn.classList.add('is-playing');
      btn.textContent = '⏸';
      btn.setAttribute('aria-label', 'Stop preview');
    } catch (err) {
      if (panel) panel.innerHTML = '<p class="detail__audio-error">Network error: ' + esc(err.message) + '</p>';
      activePreviewId = null;
      btn.disabled = false; btn.textContent = '▶';
    }
  }

  function render() {
    if (activePreviewId) stopPreview(activePreviewId);
    var list = $('wl-list');
    if (!items.length) { list.innerHTML = '<div class="empty">Nothing here yet, add the first record below.</div>'; renderPager(0); return; }
    items.sort(function (a, b) { return (a.artist || '').toLowerCase().localeCompare((b.artist || '').toLowerCase()); });

    var totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    var start = (currentPage - 1) * PAGE_SIZE;
    var pageItems = items.slice(start, start + PAGE_SIZE);

    list.innerHTML = pageItems.map(function (w) {
      var nums = [];
      if (w.price_median != null) nums.push(fmt(w.price_median));
      else if (w.current_ask != null) nums.push(fmt(w.current_ask) + ' listed');
      else nums.push('NEVER SOLD');
      var rid = w.discogs_release_id;
      var link = rid ? 'https://www.discogs.com/sell/release/' + encodeURIComponent(rid) : 'https://www.discogs.com/search/?q=' + encodeURIComponent((w.artist || '') + ' ' + (w.title || '')) + '&type=release';
      return '<div class="wl-item">'
        + (w.cover_url ? '<img class="wl-thumb" src="' + esc(w.cover_url) + '" alt="" loading="lazy">' : '<span class="wl-thumb" aria-hidden="true"></span>')
        + '<span class="wl-who"><span class="wl-artist">' + esc(w.artist) + '</span>: <span class="wl-title">' + esc(w.title) + '</span>'
        + '</span>'
        + '<button type="button" class="wl-play" data-id="' + esc(w.id) + '" data-artist="' + esc(w.artist) + '" data-title="' + esc(w.title) + '" aria-label="Play preview" title="Play preview">▶</button>'
        + '<span class="wl-nums">' + nums.join(' · ')
        + ' · <a href="' + link + '" target="_blank" rel="noopener">see listings</a>'
        + '<button class="wl-del" data-id="' + esc(w.id) + '" aria-label="Remove">×</button></span>'
        + '</div>'
        + '<div class="wl-audio-panel" id="wl-audio-' + esc(w.id) + '" hidden></div>';
    }).join('');

    renderPager(totalPages);
  }

  // Best-effort Discogs lookup for cover art + a release reference — never
  // blocks the add. If Discogs is unreachable or nothing matches, the item
  // still gets added with no cover_url, same graceful behavior as before.
  async function lookupCover(artist, title) {
    try {
      var qs = '?artist=' + encodeURIComponent(artist) + '&title=' + encodeURIComponent(title);
      var res = await fetch('/api/discogs/lookup' + qs);
      if (!res.ok) return {};
      var data = await res.json();
      var best = Array.isArray(data.candidates) && data.candidates.length ? data.candidates[0] : null;
      if (!best) return {};
      return {
        cover_url: best.thumb || null,
        discogs_release_id: best.discogs_release_id || null,
        discogs_url: best.discogs_release_id ? 'https://www.discogs.com/release/' + best.discogs_release_id : null
      };
    } catch (err) {
      return {}; // graceful — a lookup failure never blocks adding the item
    }
  }

  async function addItem() {
    var artist = $('f-artist').value.trim();
    var title = $('f-title').value.trim();
    if (!artist || !title) { showError('Artist and title are required.'); return; }

    var addBtn = $('f-add');
    var origText = addBtn.textContent;
    addBtn.disabled = true;
    addBtn.textContent = 'Adding…';

    var hex = ''; var bytes = new Uint8Array(8); crypto.getRandomValues(bytes);
    for (var i = 0; i < bytes.length; i++) { hex += bytes[i].toString(16).padStart(2, '0'); }
    var found = await lookupCover(artist, title);
    var item = {
      id: 'wish_' + hex,
      artist: artist,
      title: title,
      max_price: null,
      currency: 'EUR',
      discogs_release_id: found.discogs_release_id || null,
      discogs_url: found.discogs_url || null,
      cover_url: found.cover_url || null,
      notes: '',
      current_ask: null,
      ask_updated_at: null,
      created_at: new Date().toISOString()
    };
    try {
      var res = await fetch('/api/wishlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) });
      if (!res.ok) { var p = await res.json().catch(function(){return {};}); throw new Error(p.error || 'HTTP ' + res.status); }
      clearError();
      $('f-artist').value = ''; $('f-title').value = '';
      items.push(item);
      render();
    } catch (err) { showError('Add failed: ' + err.message); }
    finally { addBtn.disabled = false; addBtn.textContent = origText; }
  }

  async function delItem(id) {
    if (!confirm('Remove this record from the wishlist?')) return;
    try {
      var res = await fetch('/api/wishlist/' + encodeURIComponent(id), { method: 'DELETE' });
      if (!res.ok) { var p = await res.json().catch(function(){return {};}); throw new Error(p.error || 'HTTP ' + res.status); }
      clearError();
      items = items.filter(function (x) { return x.id !== id; });
      render();
    } catch (err) { showError('Delete failed: ' + err.message); }
  }

  document.addEventListener('DOMContentLoaded', function () {
    $('f-add').addEventListener('click', addItem);
    $('wl-list').addEventListener('click', function (e) {
      var delBtn = e.target.closest && e.target.closest('.wl-del');
      if (delBtn && delBtn.dataset.id) { delItem(delBtn.dataset.id); return; }
      var playBtn = e.target.closest && e.target.closest('.wl-play');
      if (playBtn && playBtn.dataset.id) { togglePreview(playBtn.dataset.id, playBtn.dataset.artist || '', playBtn.dataset.title || '', playBtn); return; }
    });
    $('wl-pager').addEventListener('click', function (e) {
      if (e.target && e.target.id === 'wl-prev' && !e.target.disabled) { currentPage--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      if (e.target && e.target.id === 'wl-next' && !e.target.disabled) { currentPage++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
    load();
  });
})();
</script>
</body>
</html>
