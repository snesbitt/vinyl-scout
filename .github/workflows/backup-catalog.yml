name: Daily catalog backup

# Added 2026-08-09, see claude/weekend-netlify-github-cost-plan-2026-08-08.md
# (in the "Travel Intelligence Agent" Claude project) for the full rationale.
# Runs entirely inside Actions -- no Netlify compute, no Netlify credential
# of any kind. Fetches the live public catalog from vinylscout.org's own
# /api/records endpoint and commits a snapshot straight to this repo, using
# only Actions' own built-in GITHUB_TOKEN (scoped to this one workflow run).
#
# This is additive alongside the existing Netlify-scheduled backup.mjs, not
# a replacement yet -- both will run for a period so Susan can compare a
# real run's output against the Netlify version before retiring the old
# one. Once she's confident this is working (check the Actions tab, or
# trigger it manually via "Run workflow" below), backup.mjs and its 09:00
# UTC schedule can be removed from netlify/functions/ to actually realize
# the Netlify compute-credit savings this migration is for.
#
# Scheduled 5 minutes after the old Netlify job's 09:00 UTC time, same
# offset convention already used for backup-watching.mjs, so overlapping
# backups (this one and the old one, during the transition period) don't
# race on anything.
#
# 2026-09-14: backup-watching.yml (same shape as this file) was found
# failing intermittently on a plain `git push` that gives up the instant
# main has moved since checkout -- no retry. This job hasn't hit that in
# practice (nothing else commits to this repo on this job's schedule the
# way watching.mjs's own Contents-API writes do for the watching job), but
# the push step here has the identical latent bug, so it gets the identical
# fix rather than waiting for its own future collision to prove it out.

on:
  schedule:
    - cron: "5 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch catalog and write snapshot
        id: backup
        run: node scripts/backup-catalog.mjs

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.backup.outputs.backup_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit (catalog snapshot for today already matches, or this is a same-day re-run)."
            exit 0
          fi
          git commit -m "backup: ${{ steps.backup.outputs.backup_path }} (${{ steps.backup.outputs.record_count }} records, via GitHub Actions)"

          # Push, and if main moved since checkout, rebase onto the latest
          # main and retry -- see this file's 2026-09-14 header note.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
          fi
            echo "Push rejected on attempt $attempt (main moved since checkout) -- fetching and rebasing before retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase failed -- a real conflict, not just a race. Aborting for a human to look at."
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Exhausted push retries -- something kept landing on main faster than this job could catch up."
          exit 1
