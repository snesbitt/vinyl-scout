name: Concert Radar health check

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  concert-radar-health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run health check + attempt repair
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/concert-radar-health-check.mjs
        continue-on-error: true

      - name: Open pull request if a repair or a venue disable was made
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="concert-radar-autofix/${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git add netlify/functions/venue-shows.mjs CLAUDE.md
          git commit -m "${{ steps.check.outputs.commit_message }}"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "${{ steps.check.outputs.pr_title }}" \
            --body-file "${{ steps.check.outputs.pr_body_path }}"

      - name: Fail the run if something needs human attention
        if: steps.check.outcome == 'failure'
        run: |
          echo "Health check found something it could not resolve on its own (a disabled venue, a stale catalog-cache, or a SeatGeek spot-check failure). See the job summary above and, if one was opened, the auto-repair PR." >&2
          exit 1
