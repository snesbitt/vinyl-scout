name: Daily watching-list backup

# Added as the second step of the Netlify-to-GitHub cost/reliability
# migration scripts/backup-catalog.mjs started (2026-08-09) -- see that
# workflow's own header comment and CLAUDE.md's matching entry for the
# full rationale. Runs entirely inside Actions -- no Netlify compute, no
# Netlify credential of any kind. Fetches the live public watching list
# from vinylscout.org's own /api/watching endpoint and commits a snapshot
# straight to this repo, using only Actions' own built-in GITHUB_TOKEN
# (scoped to this one workflow run).
#
# This is additive alongside the existing Netlify-scheduled
# backup-watching.mjs, not a replacement yet -- both will run for a period
# so Susan can compare a real Actions run's output against it and confirm
# both are producing correct, matching snapshots. Once she's confident
# this is working (check the Actions tab, or trigger it manually via
# "Run workflow" below), backup-watching.mjs and run-watching-backup.mjs
# can be removed from netlify/ to actually realize the Netlify compute
# savings this migration is for.
#
# Scheduled at 09:10 UTC -- 5 minutes after backup-catalog.yml's own
# 09:05 UTC Actions run and 5 minutes after the old Netlify job's own
# 09:05 UTC schedule, so none of the three race on the same GitHub API
# rate-limit window or the same repo ref during the transition period.
#
# 2026-09-14: this job had been failing intermittently (3 of 32 scheduled
# runs so far) with a plain `git push` that gives up the instant the remote
# has moved since checkout -- non-fast-forward, no retry. This repo has a
# real, regular second writer: watching.mjs's own DELETE handler commits
# straight to watching-state.json via the GitHub Contents API (see its v2
# header comment) any time Susan removes a watched artist on the live site,
# at whatever moment that happens to be -- unrelated to this job's own
# schedule. (GitHub's own scheduling delay also means "09:10 UTC" is only
# nominal -- real start times in the Actions history range from ~2:30am to
# ~1:50pm Pacific.) backup-catalog.yml has never hit this because nothing
# else commits to this repo on its schedule; this job shares the repo with
# a second, independent writer. Fixed below by rebasing onto the latest
# main and retrying the push a few times instead of failing on the very
# first collision. scripts/backup-watching.mjs also picked up a retry
# around its own fetch in the same pass, in case a share of these failures
# were instead a transient hiccup from the live site's own function/Blobs
# read rather than a push race -- both are cheap, safe things to retry
# since this whole job is a pure read plus a single-file commit.

on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup-watching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch watching list and write snapshot
        id: backup
        run: node scripts/backup-watching.mjs

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.backup.outputs.backup_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit (watching snapshot for today already matches, or this is a same-day re-run)."
            exit 0
          fi
          git commit -m "watching-backup: ${{ steps.backup.outputs.backup_path }} (${{ steps.backup.outputs.item_count }} items, via GitHub Actions)"

          # Push, and if main moved since checkout (e.g. watching.mjs's own
          # Contents-API commit to watching-state.json landed in between),
          # rebase onto the latest main and retry -- our change only ever
          # touches one file under backups/watching/, so a real conflict
          # with another writer is not expected; this just absorbs the race.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt (main moved since checkout) -- fetching and rebasing before retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase failed -- a real conflict, not just a race. Aborting for a human to look at."
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Exhausted push retries -- something kept landing on main faster than this job could catch up."
          exit 1
