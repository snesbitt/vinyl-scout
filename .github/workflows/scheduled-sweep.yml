name: Weekly catalog sweep

# Added 2026-08-14, following the exact precedent already established by
# .github/workflows/backup-catalog.yml (2026-08-09). Runs entirely inside
# Actions -- no Netlify compute, no Netlify credential of any kind. Fetches
# the live public catalog/wishlist/watching lists plus venue-shows and
# jambase-shows from vinylscout.org's own public API, runs the same
# artist-relevance matching and dedupe logic netlify/functions/scheduled-
# sweep.mjs already uses, and commits the merged result straight to this
# repo, using only Actions' own built-in GITHUB_TOKEN.
#
# CUTOVER STATUS, updated 2026-08-19. The read half is DONE:
# netlify/functions/catalog-cache.mjs v2 now serves data/catalog-cache.json,
# the file this job commits, instead of the Blobs store. So /api/catalog-cache
# is fed by this workflow now, not by the Netlify scheduled function.
#
# What is still outstanding is the other half: netlify/functions/
# scheduled-sweep.mjs still exists and still writes the 'catalog-cache' Blobs
# store on its own Netlify schedule, with nothing reading it. Harmless, and
# left in place on purpose as a fallback until /api/catalog-cache has been
# checked against production. Retire it, and the Blobs store, once that check
# is done.
#
# Scheduled Sundays 10:00 UTC -- an hour clear of backup-catalog.yml's daily
# 09:05 UTC run and the old Netlify job's own weekly cadence, so the two
# don't race on anything during the transition window.
#
# 2026-09-14: backup-watching.yml (same shape as this file) was found
# failing intermittently on a plain `git push` that gives up the instant
# main has moved since checkout -- no retry. Same latent bug here, same fix.

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scheduled-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sweep catalog and write cache
        id: sweep
        run: node scripts/scheduled-sweep.mjs

      - name: Commit cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.sweep.outputs.sweep_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit (catalog cache matches last run)."
            exit 0
          fi
          git commit -m "sweep: ${{ steps.sweep.outputs.sweep_path }} (${{ steps.sweep.outputs.show_count }} shows, ${{ steps.sweep.outputs.artist_count }} artists, via GitHub Actions)"

          # Push, and if main moved since checkout, rebase onto the latest
          # main and retry -- see this file's 2026-09-14 header note.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
          fi
            echo "Push rejected on attempt $attempt (main moved since checkout) -- fetching and rebasing before retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase failed -- a real conflict, not just a race. Aborting for a human to look at."
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Exhausted push retries -- something kept landing on main faster than this job could catch up."
          exit 1
