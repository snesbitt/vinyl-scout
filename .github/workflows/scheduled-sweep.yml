name: Weekly catalog sweep

# Added 2026-08-14, following the exact precedent already established by
# .github/workflows/backup-catalog.yml (2026-08-09). Runs entirely inside
# Actions -- no Netlify compute, no Netlify credential of any kind. Fetches
# the live public catalog/wishlist/watching lists plus venue-shows and
# jambase-shows from vinylscout.org's own public API, runs the same
# artist-relevance matching and dedupe logic netlify/functions/scheduled-
# sweep.mjs already uses, and commits the merged result straight to this
# repo, using only Actions' own built-in GITHUB_TOKEN.
#
# TRANSITION PERIOD: this is additive alongside the existing Netlify-
# scheduled scheduled-sweep.mjs, not a replacement yet -- both will run for
# a period so Susan can compare a real run's output (data/catalog-cache.json)
# against what /api/catalog-cache currently serves from Blobs before
# retiring the old one. Once confident this is working (check the Actions
# tab, or trigger it manually via "Run workflow" below), netlify/functions/
# scheduled-sweep.mjs can be removed AND netlify/functions/catalog-cache.mjs
# needs to be updated to read data/catalog-cache.json instead of the Blobs
# store -- see the accompanying migration note for that second half of the
# cutover, which touches function logic and should go through a PR per the
# repo's own hybrid gating convention, not a direct commit.
#
# Scheduled Sundays 10:00 UTC -- an hour clear of backup-catalog.yml's daily
# 09:05 UTC run and the old Netlify job's own weekly cadence, so the two
# don't race on anything during the transition window.

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scheduled-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sweep catalog and write cache
        id: sweep
        run: node scripts/scheduled-sweep.mjs

      - name: Commit cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.sweep.outputs.sweep_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit (catalog cache matches last run)."
          else
            git commit -m "sweep: ${{ steps.sweep.outputs.sweep_path }} (${{ steps.sweep.outputs.show_count }} shows, ${{ steps.sweep.outputs.artist_count }} artists, via GitHub Actions)"
            git push
          fi
