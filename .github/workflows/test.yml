name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push: catches content drift (About page
    # "records tracked" stat tile vs. the latest committed catalog backup,
    # see scripts/check-content-drift.mjs) even on a week with no code
    # changes at all. Runs the same job as a normal push, so no separate
    # workflow file or new failure mode.
    - cron: "0 13 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    # has_netlify_token feeds the deploy job's `if:` below. GitHub Actions
    # does not reliably support referencing `secrets` directly inside a
    # job-level `if:` (this is what actually broke the 2026-08-14 attempt
    # at this exact fix -- the whole workflow failed to even start any
    # jobs, "No jobs were run", not just the deploy job). Secrets ARE
    # always readable inside a step's `env:`, so the check runs there and
    # is exposed as a job output instead -- job outputs are a fully
    # supported, ordinary value in another job's `if:` condition.
    outputs:
      has_netlify_token: ${{ steps.check-netlify-token.outputs.has_token }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check whether NETLIFY_AUTH_TOKEN is set
        id: check-netlify-token
        env:
          TOKEN_IS_SET: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
        run: echo "has_token=$TOKEN_IS_SET" >> "$GITHUB_OUTPUT"

  # Added alongside the branch-protection/PR workflow change (see CLAUDE.md's
  # matching entry): deploys via the Netlify CLI, driven explicitly by
  # Actions, rather than relying only on Netlify's own git-integration
  # auto-deploy. Only runs on an actual push to main after tests pass --
  # never on a PR run (a PR still gets Netlify's own automatic Deploy
  # Preview via its git integration, unaffected by this) and never on the
  # weekly content-drift cron push above.
  #
  # This does NOT replace Netlify's git-integration auto-deploy by itself
  # -- both will fire on a push to main until Susan explicitly turns off
  # "auto publishing" in Netlify's own site settings (Site configuration ->
  # Build & deploy). Until she does, a push to main triggers two separate,
  # harmless, redundant deploys of the same content -- wasteful, not
  # unsafe. Flagged here rather than silently left for someone to notice.
  #
  # Needs a NETLIFY_AUTH_TOKEN repo secret (a Netlify Personal Access
  # Token, User settings -> Applications -> New access token) -- nothing
  # else. NETLIFY_SITE_ID below is this site's id, not a secret (same
  # value visible in this site's own Netlify dashboard URL).
  #
  # 2026-08-14 fix, corrected same day: this job failed its first three
  # real runs (8/13, then two more the morning of 8/14) because
  # NETLIFY_AUTH_TOKEN was never actually added as a repo secret -- each
  # failure sent Susan a "some jobs were not successful" email for a job
  # that could never have succeeded. A first attempt at fixing this by
  # putting `secrets.NETLIFY_AUTH_TOKEN != ''` directly in this job's
  # own `if:` broke the entire workflow instead (GitHub Actions doesn't
  # reliably support `secrets` in a job-level `if:` -- the whole run
  # failed with "No jobs were run", meaning even the `test` job never
  # started). Fixed for real by checking the secret inside a `test` step
  # (secrets ARE always readable in a step's `env:`) and exposing the
  # result as `needs.test.outputs.has_netlify_token` instead -- job
  # outputs are always safe to use in another job's `if:`. Unset secret
  # -> this job reports SKIPPED, not failed, no more noisy email. The
  # moment the secret is added in GitHub repo Settings -> Secrets and
  # variables -> Actions, this condition is true and the job deploys for
  # real on the very next push -- no other change needed.
  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.test.outputs.has_netlify_token == 'true'
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 605623dc-208f-42c0-a13f-3db9dfa5662b
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Netlify (production)
        run: npx --yes netlify-cli@21 deploy --prod --dir=. --site="$NETLIFY_SITE_ID"
