name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push: catches content drift (About page
    # "records tracked" stat tile vs. the latest committed catalog backup,
    # see scripts/check-content-drift.mjs) even on a week with no code
    # changes at all. Runs the same job as a normal push, so no separate
    # workflow file or new failure mode. Also drives the deploy-freshness
    # job below, which only runs on this trigger.
    - cron: "0 13 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    # has_netlify_token feeds the deploy job's `if:` below. GitHub Actions
    # does not reliably support referencing `secrets` directly inside a
    # job-level `if:` (this is what actually broke the 2026-08-14 attempt
    # at this exact fix -- the whole workflow failed to even start any
    # jobs, "No jobs were run", not just the deploy job). Secrets ARE
    # always readable inside a step's `env:`, so the check runs there and
    # is exposed as a job output instead -- job outputs are a fully
    # supported, ordinary value in another job's `if:` condition.
    outputs:
      has_netlify_token: ${{ steps.check-netlify-token.outputs.has_token }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check whether NETLIFY_AUTH_TOKEN is set
        id: check-netlify-token
        env:
          TOKEN_IS_SET: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
        run: echo "has_token=$TOKEN_IS_SET" >> "$GITHUB_OUTPUT"

  # Added alongside the branch-protection/PR workflow change (see CLAUDE.md's
  # matching entry): deploys via the Netlify CLI, driven explicitly by
  # Actions, rather than relying only on Netlify's own git-integration
  # auto-deploy. Only runs on an actual push to main after tests pass --
  # never on a PR run (a PR still gets Netlify's own automatic Deploy
  # Preview via its git integration, unaffected by this) and never on the
  # weekly content-drift cron push above.
  #
  # This does NOT replace Netlify's git-integration auto-deploy by itself
  # -- both will fire on a push to main until Susan explicitly turns off
  # "auto publishing" in Netlify's own site settings (Site configuration ->
  # Build & deploy). Until she does, a push to main triggers two separate,
  # harmless, redundant deploys of the same content -- wasteful, not
  # unsafe. Flagged here rather than silently left for someone to notice.
  #
  # Needs a NETLIFY_AUTH_TOKEN repo secret (a Netlify Personal Access
  # Token, User settings -> Applications -> New access token) -- nothing
  # else. NETLIFY_SITE_ID below is this site's id, not a secret (same
  # value visible in this site's own Netlify dashboard URL).
  #
  # 2026-08-14 fix, corrected same day: this job failed its first three
  # real runs (8/13, then two more the morning of 8/14) because
  # NETLIFY_AUTH_TOKEN was never actually added as a repo secret -- each
  # failure sent Susan a "some jobs were not successful" email for a job
  # that could never have succeeded. A first attempt at fixing this by
  # putting `secrets.NETLIFY_AUTH_TOKEN != ''` directly in this job's
  # own `if:` broke the entire workflow instead (GitHub Actions doesn't
  # reliably support `secrets` in a job-level `if:` -- the whole run
  # failed with "No jobs were run", meaning even the `test` job never
  # started). Fixed for real by checking the secret inside a `test` step
  # (secrets ARE always readable in a step's `env:`) and exposing the
  # result as `needs.test.outputs.has_netlify_token` instead -- job
  # outputs are always safe to use in another job's `if:`. Unset secret
  # -> this job reports SKIPPED, not failed, no more noisy email. The
  # moment the secret is added in GitHub repo Settings -> Secrets and
  # variables -> Actions, this condition is true and the job deploys for
  # real on the very next push -- no other change needed.
  # 2026-08-21 — READ THIS BEFORE TURNING OFF AUTO-PUBLISHING IN NETLIFY.
  #
  # This job has never run. It self-disables via has_netlify_token below, so it
  # is dormant and harmless, not broken. The trap is what happens around it.
  #
  # On 2026-08-13 auto-publishing was switched off in Netlify so this job
  # wouldn't double-deploy. It then never ran, because NETLIFY_AUTH_TOKEN was
  # never added — and with both publish paths off, vinylscout.org froze on a
  # 2026-08-14 deploy for 8 days. Netlify's API reported that deploy `ready`
  # throughout, correctly: it WAS ready, it simply wasn't being republished.
  # Nothing caught it, because every check here watched data freshness rather
  # than whether the deployed site matched the repo.
  #
  # So: adding NETLIFY_AUTH_TOKEN activates this job and you get two deploys per
  # push — wasteful, not harmful. Turning auto-publishing off to stop that is
  # only safe once you have SEEN this job publish successfully. Confirm with
  # `npm run check:deploy` (scripts/check-deploy-fresh.mjs), which compares the
  # live pages byte-for-byte against this repo.
  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.test.outputs.has_netlify_token == 'true'
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 605623dc-208f-42c0-a13f-3db9dfa5662b
    steps:
      - uses: actions/checkout@v4
        with:
          # netlify-ignore.sh diffs CACHED_COMMIT_REF..COMMIT_REF -- needs
          # real history, not the default single-commit shallow clone.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2026-08-15: Netlify's own build skips a deploy for docs-only pushes
      # via scripts/netlify-ignore.sh (wired as netlify.toml's [build]
      # ignore); this Actions-driven deploy never had the equivalent, so a
      # docs-only push still ran a real (wasted) `netlify deploy` here even
      # though Netlify's own build correctly skipped itself for the same
      # push. Reuses the actual script rather than a second copy of its
      # path list, so the two can't drift out of sync -- CACHED_COMMIT_REF/
      # COMMIT_REF are the script's own expected inputs (Netlify's build
      # env var names); github.event.before is the direct equivalent for a
      # push event (the SHA before this push), always present here since
      # this job only ever runs on an actual push (see the job's own if:
      # above). netlify-ignore.sh's contract: exit 0 = skip, exit != 0 =
      # deploy.
      - name: Check whether this push needs a real deploy
        id: ignore-check
        env:
          CACHED_COMMIT_REF: ${{ github.event.before }}
          COMMIT_REF: ${{ github.sha }}
        run: |
          if bash scripts/netlify-ignore.sh; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Netlify (production)
        if: steps.ignore-check.outputs.should_deploy == 'true'
        run: npx --yes netlify-cli@21 deploy --prod --dir=. --site="$NETLIFY_SITE_ID"

  # scripts/check-deploy-fresh.mjs (see its own header) was written after
  # vinylscout.org spent 8 days frozen on a 2026-08-14 deploy that Netlify's
  # own API called `ready` the entire time -- the deploy WAS ready, it just
  # wasn't the one being served (a locked deploy). Until now this script
  # only ran when a human remembered to type `npm run check:deploy` by hand.
  # This job makes that check itself part of the automation, on the same
  # weekly cron as the content-drift check above -- so a repeat of the
  # August incident is caught within a week (previously: never, on its own)
  # instead of only when someone happens to notice the site looks stale.
  #
  # Deliberately scheduled-only, not on every push: right after a push the
  # deploy may still be building, and `npm run check:deploy` is meant to be
  # run with --wait for that case (already documented in this repo as a
  # manual post-deploy step). This job's job is the *unattended* backstop --
  # catching drift on a week nobody pushed anything at all, which is exactly
  # the scenario the August incident was.
  deploy-freshness:
    name: Deploy freshness check (live site vs. repo)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compare the live site against this repo
        id: freshness
        run: |
          set +e
          npm run check:deploy -- --json > deploy-freshness-result.json
          CODE=$?
          set -e
          cat deploy-freshness-result.json
          if [ "$CODE" -ne 0 ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      # One open issue per incident, not one per week the drift persists --
      # re-runs while the same drift is still open add a comment instead of
      # piling up duplicate issues.
      - name: Open or update an issue if the live site has drifted
        if: steps.freshness.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Deploy freshness check failed: live site does not match main"
          BODY_FILE="$(mktemp)"
          {
            echo "Weekly scheduled \`npm run check:deploy\` found that vinylscout.org does not"
            echo "byte-for-byte match what is committed on \`main\` ($(date -u +%Y-%m-%dT%H:%M:%SZ))."
            echo ""
            echo "This is the exact failure mode that froze vinylscout.org on a 2026-08-14 deploy"
            echo "for 8 days -- Netlify's API reported that deploy \`ready\` the whole time. Check"
            echo "first for a LOCKED deploy: app.netlify.com -> this site -> Deploys -> find the"
            echo "one marked Locked -> Unlock -> Trigger deploy."
            echo ""
            echo "Full comparison (scripts/check-deploy-fresh.mjs --json):"
            echo '```json'
            cat deploy-freshness-result.json
            echo '```'
            echo ""
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$BODY_FILE"

          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Fail the run so it shows red, not just the issue
        if: steps.freshness.outputs.drifted == 'true'
        run: |
          echo "Live site does not match this repo's main branch. See the opened/updated issue for details." >&2
          exit 1
